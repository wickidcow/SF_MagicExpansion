name: Bug report
description: Report a problem with SF_MagicExpansion.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SF_MagicExpansion. Please provide the exact software versions,
        reproduction steps and relevant error logs. Redact passwords, tokens,
        private IP addresses and other sensitive details before posting logs.
  - type: input
    id: addon-version
    attributes:
      label: Addon version or build
      placeholder: Release version or commit SHA
    validations:
      required: true
  - type: input
    id: slimefun-version
    attributes:
      label: Slimefun Legacy version or build
      placeholder: Release version or commit SHA
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server software and version
      placeholder: Paper / Purpur / Leaf / Folia, Minecraft version, build
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands, menus, recipes and exact steps where relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console logs or stack traces
      description: Paste related errors or attach a log file after redacting secrets.
      render: shell
  - type: textarea
    id: other-plugins
    attributes:
      label: Other plugins or additional context
      description: List relevant addon versions, conflicts, screenshots or profiler links.

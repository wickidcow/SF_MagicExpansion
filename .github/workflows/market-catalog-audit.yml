name: Market catalog audit

on:
  push:
    branches: ["feature/slimefun-market-catalog-20261015"]
  pull_request:
    paths:
      - 'src/main/java/io/Yomicer/magicExpansion/utils/shop/**'
      - 'src/main/resources/market_catalog.yml'
      - 'src/test/java/io/Yomicer/magicExpansion/utils/shop/**'
      - '.github/workflows/market-catalog-audit.yml'

permissions:
  contents: read

concurrency:
  group: market-catalog-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve exact source for offline review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git rev-parse HEAD > audit/source.txt
          git archive --format=zip --output=audit/source-review.zip HEAD
          sha256sum audit/source-review.zip > audit/source-review.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: market-catalog-review-evidence
          path: audit/
          if-no-files-found: error
          retention-days: 7

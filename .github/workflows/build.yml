name: Build MagicExpansion

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.1.9"
  OUTPUT_NAME: "SF_MagicExpansion1.1.9.jar"

concurrency:
  group: magicexpansion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install checksum-verified stable Slimefun API
        run: bash scripts/install_slimefun_api.sh
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_MagicExpansion${VERSION}.jar"
          test -s "docs/releases/${VERSION}.md"
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "$VERSION"
          grep -Fq '<artifactId>MagicExpansion</artifactId>' pom.xml
          grep -Fq '<name>MagicExpansion</name>' pom.xml
          grep -Fq '<finalName>SF_MagicExpansion${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'softdepend: [MagicLegacy, Networks, NetworksExpansion]' src/main/resources/plugin.yml
          grep -Fq 'loadbefore: [RykenSlimefunCustomizer]' src/main/resources/plugin.yml
          if grep -Fq 'softdepend: [MagicLegacy, RykenSlimefunCustomizer' src/main/resources/plugin.yml; then
            echo "RykenSlimefunCustomizer must be loadbefore, not softdepend"
            exit 1
          fi
      - name: Verify Paper/Purpur 1.21.11 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
      - name: Verify Paper/Purpur 26.2 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests "-Dpaper.version=[26.2.build,26.3)" clean package
      - name: Verify Paper 26.3 alpha compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=26.3-rc-3.build.1-alpha clean package
      - name: Build universal release JAR from 1.21.11 baseline
        run: mvn --batch-mode --no-transfer-progress -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean verify
      - name: Verify and stage canonical JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          python3 - "$JAR" "$VERSION" <<'PY'
          import re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              assert jar.testzip() is None
              descriptor = jar.read('plugin.yml').decode('utf-8')
              version = re.search(r'''(?m)^version:\s*['"]?([^'"\s]+)''', descriptor)
              assert version and version.group(1) == sys.argv[2]
              assert "api-version: '1.21.11'" in descriptor
              for name in jar.namelist():
                  if name.endswith('.class') and not name.startswith('META-INF/versions/'):
                      assert int.from_bytes(jar.read(name)[6:8], 'big') <= 65, name
                  assert not name.startswith(('org/junit/', 'org/mockbukkit/')), name
          PY
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Preserve actual unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magicexpansion-unit-tests
          path: target/surefire-reports/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish canonical raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != "$OUTPUT_NAME" ]]; then gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y; fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file "docs/releases/${VERSION}.md" --title "SF_MagicExpansion ${VERSION}"
          fi

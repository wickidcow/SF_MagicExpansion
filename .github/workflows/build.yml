name: Build MagicExpansion Legacy English

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MagicExpansion-Legacy-English
          path: target/MagicExpansion-Legacy-English-*.jar
          if-no-files-found: error

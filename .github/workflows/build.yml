name: Build MagicExpansion Legacy English

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.1.3"
  OUTPUT_NAME: "SF_MagicExpansion1.1.3.jar"

concurrency:
  group: magicexpansion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.1.3</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Paper/Purpur 1.21.11 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
      - name: Verify Paper/Purpur 26.2 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=26.2.build.111-stable clean package
      - name: Build universal release JAR from 1.21.11 baseline
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/MagicExpansion-Legacy-English-1.1.3.jar"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          unzip -p "dist/${OUTPUT_NAME}" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "dist/${OUTPUT_NAME}" io.Yomicer.magicExpansion.MagicExpansion | grep -Fq 'major version: 65'
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="MagicExpansion Release 11 / Build 91 port for Slimefun Legacy. Ports the upstream fishing fixes, requires Water Cloud catches to have the hook in water, keeps normal fishing events uncancelled, and completes an English player-facing cleanup across Water Cloud menus, guide categories, lure names, and bait-bag messages. Retains Java 21 bytecode and Minecraft/Purpur 1.21.11 through Paper/Purpur 26.2 compatibility."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_MagicExpansion $TAG"
          fi
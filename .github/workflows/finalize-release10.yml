name: Finalize Release 10 Port

on:
  push:
    branches: [ "release-1.1.2-merge" ]
    paths:
      - ".github/workflows/finalize-release10.yml"
      - ".github/scripts/finalize_release10.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Apply gameplay registrations and English cleanup
        run: python3 .github/scripts/finalize_release10.py
      - name: Commit finalized source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize MagicExpansion Release 10 port"
          git push origin HEAD:release-1.1.2-merge
      - name: Verify 1.21.11 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
      - name: Verify 26.2 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=26.2.build.111-stable clean package

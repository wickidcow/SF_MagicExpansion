name: Black Market published-core full-stack gate
on:
  push:
    branches: ['fix/blackmarket-offer-items-*']
  pull_request:
    paths: ['src/**', 'tests/runtime/**', '.github/workflows/blackmarket-full-stack.yml']
permissions:
  contents: read
concurrency:
  group: blackmarket-full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {software: paper, minecraft: '1.21.11', java: '21', lane: 'paper-1.21.11'}
          - {software: paper, minecraft: '26.2', java: '25', lane: 'paper-26.2'}
          - {software: paper, minecraft: '26.3', java: '25', lane: 'paper-26.3'}
          - {software: purpur, minecraft: '26.3', java: '25', lane: 'purpur-26.3'}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: 50ba75921a18ca0a83434ac242cd7bb18dc3c370
          path: legacy-validation
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the exact addon source
        run: |
          set -euo pipefail
          mkdir -p audit/classes
          git rev-parse HEAD > audit/source-commit.txt
          bash scripts/install_slimefun_api.sh > audit/build.log 2>&1
          mvn -B -ntp clean verify >> audit/build.log 2>&1 || { tail -n 100 audit/build.log; exit 1; }
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=classpath.txt >> audit/build.log 2>&1
          javac --release 21 -cp "$(find target -maxdepth 1 -name 'SF_MagicExpansion*.jar' -print -quit):$(cat classpath.txt)" -d audit/classes tests/runtime/BlackMarketPlayerFlowProbe.java
          printf "name: BlackMarketPlayerFlowProbe\nmain: audit.BlackMarketPlayerFlowProbe\nversion: '1'\napi-version: '1.21.11'\ndepend: [Slimefun, magicexpansion]\n" > audit/classes/plugin.yml
          jar --create --file audit/BlackMarketPlayerFlowProbe.jar -C audit/classes .
      - name: Preserve the published core and all 44 unrelated addon JARs
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.74/Slimefun-Legacy4.1.74.jar' -o audit/Slimefun-Legacy4.1.74.jar
          echo '72a524d7c0d6f75a9decbf06679515887273ae53673d3f5ee38f355bef952c96  audit/Slimefun-Legacy4.1.74.jar' | sha256sum -c -
          curl -fL --retry 3 'https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.74/SF_Addons_1.21.11-26.3.zip' -o audit/published-r137.zip
          echo '534768b57854fdc21280bda483266217a61bc140a48df3f246c71842c82b173d  audit/published-r137.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          digest = lambda data: hashlib.sha256(data).hexdigest()
          original = zipfile.ZipFile('audit/published-r137.zip')
          data = {name: original.read(name) for name in original.namelist()}
          manifest = json.loads(data['SF_ADDON_MANIFEST.json'])
          assert manifest['bundle_revision'] == 137 and len(manifest['addons']) == 45
          candidate = list(Path('target').glob('SF_MagicExpansion*.jar'))
          assert len(candidate) == 1
          candidate = candidate[0]
          jar_bytes = candidate.read_bytes()
          with zipfile.ZipFile(candidate) as jar:
              descriptor = jar.read('plugin.yml').decode()
              version = re.search(r'''(?m)^version:\s*['"]?([^'"\s]+)''', descriptor).group(1)
              assert candidate.name == f'SF_MagicExpansion{version}.jar'
              assert not any(n.startswith(('audit/', 'org/junit/', 'org/mockbukkit/')) for n in jar.namelist())
          for addon in manifest['addons']:
              assert digest(data[addon['jar']]) == addon['sha256']
              if addon['repository'] == 'wickidcow/SF_MagicExpansion':
                  del data[addon['jar']]
                  addon.update(jar=candidate.name, source_jar=candidate.name, version=version,
                               sha256=digest(jar_bytes), commit=Path('audit/source-commit.txt').read_text().strip())
          data[candidate.name] = jar_bytes
          manifest.pop('targeted_refresh', None)
          manifest['verification_candidate'] = True
          manifest['publication'] = 'NOT_PUBLISHED; based on r137 with only MagicExpansion replaced for testing'
          data['SF_ADDON_MANIFEST.json'] = (json.dumps(manifest, indent=2) + '\n').encode()
          data['SHA256SUMS.txt'] = ''.join(f'{digest(data[n])}  {n}\n' for n in sorted(data) if n.endswith('.jar')).encode()
          data['COMPATIBILITY.txt'] = b'UNPUBLISHED TEST CANDIDATE. This ZIP must not replace an official release.\n'
          with zipfile.ZipFile('audit/candidate-addons.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for n in sorted(data): out.writestr(n, data[n])
          with zipfile.ZipFile('audit/candidate-addons.zip') as out:
              unchanged = [n for n in original.namelist() if n.endswith('.jar') and 'MagicExpansion' not in n]
              assert len(unchanged) == 44 and all(out.read(n) == original.read(n) for n in unchanged)
              assert len([n for n in out.namelist() if n.endswith('.jar')]) == 45
          Path('audit/bundle-proof.json').write_text(json.dumps({'unchanged_addons': 44, 'source': manifest['addons'],
              'candidate_bundle_sha256': digest(Path('audit/candidate-addons.zip').read_bytes()),
              'candidate_jar_sha256': digest(jar_bytes), 'candidate_version': version,
              'publication': 'NOT_PUBLISHED'}, indent=2))
          # Restrict the copied disposable runner's listener to loopback. Preserve
          # every existing startup/restart assertion and dependency check.
          script = Path('legacy-validation/scripts/full_stack_runtime_smoke.sh')
          text = script.read_text()
          needle = 'motd=Slimefun Legacy full-stack runtime smoke\n'
          assert text.count(needle) == 1
          script.write_text(text.replace(needle, needle + 'server-ip=127.0.0.1\nserver-port=0\n'))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Require all 45 addons across two full-stack boots
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          SLIMEFUN_SMOKE_VERSION: '4.1.74'
          PURPUR_SMOKE_BUILD: '2646'
          SERVER_DOWNLOAD_USER_AGENT: MagicExpansion-Full-Stack-Player-Flow/1.0
        run: |
          set -euo pipefail
          bash legacy-validation/scripts/full_stack_runtime_smoke.sh audit/Slimefun-Legacy4.1.74.jar audit/candidate-addons.zip audit/full-stack > audit/full-stack-runner.log 2>&1 || { tail -n 100 audit/full-stack-runner.log; exit 1; }
          test "$(wc -l < audit/full-stack/expected-addons.txt)" = 45
          test ! -s audit/full-stack/dependency-gated-addons.txt
          cat audit/full-stack/smoke-result.txt
      - name: Exercise purchases and a further full-stack restart
        run: |
          set -euo pipefail
          cp audit/BlackMarketPlayerFlowProbe.jar audit/full-stack/plugins/
          cd audit/full-stack
          sha256sum server.jar plugins/*.jar > flow-input-sha256.txt
          for PHASE in buy restart; do
            sha256sum -c flow-input-sha256.txt
            timeout --kill-after=20s 420s java -Xms768M -Xmx3G -Dblackmarket.offer.audit=true -Dblackmarket.flow.phase="$PHASE" -jar server.jar --nogui > "flow-${PHASE}.console.log" 2>&1
            test ! -e "flow-${PHASE}-fatal.txt" || { cat "flow-${PHASE}-fatal.txt"; tail -n 100 "flow-${PHASE}.console.log"; exit 1; }
            grep -Fxq PLAYER_FLOW_PASSED "flow-${PHASE}-result.txt"
            cat "flow-${PHASE}-result.txt"
          done
          test "$(grep '^pid=' flow-buy-result.txt)" != "$(grep '^pid=' flow-restart-result.txt)"
      - name: Preserve candidate and full-stack evidence without publishing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blackmarket-full-stack-${{ matrix.lane }}
          path: |
            audit/*.log
            audit/*.json
            audit/*.txt
            audit/candidate-addons.zip
            target/SF_MagicExpansion*.jar
            audit/full-stack/*.log
            audit/full-stack/*.txt
            audit/full-stack/plugins/BlackMarketPlayerFlowProbe/*.yml
            target/surefire-reports/TEST-*.xml
          if-no-files-found: error

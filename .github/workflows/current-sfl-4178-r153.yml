name: MagicExpansion 4.1.78/r153 current-release full-stack validation
on:
  pull_request:
    paths: ['src/**', 'pom.xml', 'tests/runtime/**', 'scripts/verify_blackmarket_fullstack_workflow.py', '.github/workflows/current-sfl-4178-r153.yml']
permissions:
  contents: read
concurrency:
  group: current-4178-r153-full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {software: paper, minecraft: '1.21.11', java: '21', lane: 'paper-1.21.11'}
          - {software: paper, minecraft: '26.2', java: '25', lane: 'paper-26.2'}
          - {software: paper, minecraft: '26.3', java: '25', lane: 'paper-26.3'}
          - {software: purpur, minecraft: '26.3', java: '25', lane: 'purpur-26.3'}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve historical 4.1.78 contract checks
        run: python3 scripts/verify_blackmarket_fullstack_workflow.py
      - uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: b14a3bcc5ef221c013f93d49b6b3a1bbdb3101e9
          path: legacy-validation
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the exact addon source
        run: |
          set -euo pipefail
          mkdir -p audit/classes
          git rev-parse HEAD > audit/source-commit.txt
          bash scripts/install_slimefun_api.sh > audit/build.log 2>&1
          mvn -B -ntp clean verify >> audit/build.log 2>&1 || { tail -n 100 audit/build.log; exit 1; }
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=classpath.txt >> audit/build.log 2>&1
          javac --release 21 -cp "$(find target -maxdepth 1 -name 'SF_MagicExpansion*.jar' -print -quit):$(cat classpath.txt)" -d audit/classes tests/runtime/BlackMarketPlayerFlowProbe.java
          printf "name: BlackMarketPlayerFlowProbe\nmain: audit.BlackMarketPlayerFlowProbe\nversion: '1'\napi-version: '1.21.11'\ndepend: [Slimefun, magicexpansion]\n" > audit/classes/plugin.yml
          jar --create --file audit/BlackMarketPlayerFlowProbe.jar -C audit/classes .
      - name: Verify current published 4.1.78 core and preserve 43 sibling addons
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.78/Slimefun-Legacy4.1.78.jar' -o audit/Slimefun-Legacy4.1.78.jar
          echo '39ca485409b27d1705a28a24e3d6e681e731709d4163bcd500d347b090ea97ba  audit/Slimefun-Legacy4.1.78.jar' | sha256sum -c -
          curl -fL --retry 3 'https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.78/SF_Addons_1.21.11-26.3.zip' -o audit/published-r153.zip
          echo '46b199845904e64d144afa5adaa1170ef391bbfc9f3493fab91481f1565c0d04  audit/published-r153.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          digest = lambda data: hashlib.sha256(data).hexdigest()
          original = zipfile.ZipFile('audit/published-r153.zip')
          data = {name: original.read(name) for name in original.namelist()}
          manifest = json.loads(data['SF_ADDON_MANIFEST.json'])
          assert manifest['bundle_revision'] == 153 and len(manifest['addons']) == 44
          assert manifest.get('bundle') == 'SF_Addons_1.21.11-26.3.zip'
          assert manifest['core_source_commit'] == 'b14a3bcc5ef221c013f93d49b6b3a1bbdb3101e9'
          assert not any('buildingstaff' in (r['repository']+' '+r['jar']).lower() for r in manifest['addons'])
          assert len({r['repository'] for r in manifest['addons']}) == 44
          assert len({r['jar'] for r in manifest['addons']}) == 44
          assert set(n for n in data if n.endswith('.jar')) == {r['jar'] for r in manifest['addons']}
          assert all(digest(data[r['jar']]) == r['sha256'] for r in manifest['addons'])
          assert sorted(data['SHA256SUMS.txt'].decode().splitlines()) == sorted(
              f"{r['sha256']}  {r['jar']}" for r in manifest['addons'])
          baseline = [r for r in manifest['addons'] if r['repository'] == 'wickidcow/SF_MagicExpansion']
          assert len(baseline) == 1
          assert baseline[0]['jar'] == 'SF_MagicExpansion1.1.19.jar'
          assert baseline[0]['version'] == '1.1.19'
          assert baseline[0]['commit'] == 'b28c304f2909f15b43da53910ce7650886cc0e6f'
          # Published r153's own ZIP manifest and SHA256SUMS.txt are authoritative
          # for these exact bytes, not a separately built standalone release JAR.
          standalone_sha = '2b870d8851b157bf9955cc4e0f2f2c86a41e1defbb2ecaa025281c58ff763621'
          print("Verified r153 MagicExpansion digest:",baseline[0]['sha256'])
          print("Separately published v1.1.19 digest:",standalone_sha)
          print("Byte-identical to standalone release:",baseline[0]['sha256']==standalone_sha)
          Path('audit/magic-baseline-provenance.json').write_text(json.dumps({
              'bundle':'v4.1.78/r153', 'repository':'wickidcow/SF_MagicExpansion',
              'version':baseline[0]['version'], 'commit':baseline[0]['commit'],
              'jar':baseline[0]['jar'],
              'manifest_verified_sha256':baseline[0]['sha256'],
              'standalone_v1_1_19_sha256':standalone_sha,
              'identical_bytes':baseline[0]['sha256']==standalone_sha,
              'publication':'NOT_PUBLISHED',
          },indent=2)+'\n')
          candidate = list(Path('target').glob('SF_MagicExpansion*.jar'))
          assert len(candidate) == 1
          candidate = candidate[0]
          jar_bytes = candidate.read_bytes()
          with zipfile.ZipFile(candidate) as jar:
              descriptor = jar.read('plugin.yml').decode()
              version = re.search(r'''(?m)^version:\s*['"]?([^'"\s]+)''', descriptor).group(1)
              assert re.fullmatch(r'[0-9]+(?:\.[0-9]+)+', version) is not None
              assert tuple(map(int, version.split('.'))) >= (1, 1, 19)
              assert candidate.name == f'SF_MagicExpansion{version}.jar'
              assert re.search(r'(?m)^name:\s*magicexpansion\s*$', descriptor)
              assert not any(n.startswith(('audit/', 'org/junit/', 'org/mockbukkit/')) for n in jar.namelist())
          replaced = 0
          for addon in manifest['addons']:
              assert digest(data[addon['jar']]) == addon['sha256']
              if addon['repository'] == 'wickidcow/SF_MagicExpansion':
                  del data[addon['jar']]
                  addon.update(jar=candidate.name, source_jar=candidate.name, version=version,
                               sha256=digest(jar_bytes), commit=Path('audit/source-commit.txt').read_text().strip())
                  replaced += 1
          assert replaced == 1
          data[candidate.name] = jar_bytes
          manifest['bundle_revision'] = 154
          manifest['build_mode'] = 'unpublished-pr-preview'
          manifest['eligible_for_release'] = False
          manifest['unpublished_addons'] = ['wickidcow/SF_MagicExpansion']
          manifest['targeted_refresh'] = {'repository': 'wickidcow/SF_MagicExpansion',
              'previous_bundle_revision': 153,
              'previous_bundle_sha256': digest(Path('audit/published-r153.zip').read_bytes()),
              'release_tag': 'v4.1.78', 'eligible_for_release': False}
          data['SF_ADDON_MANIFEST.json'] = (json.dumps(manifest, indent=2) + '\n').encode()
          data['SHA256SUMS.txt'] = ''.join(f'{digest(data[n])}  {n}\n' for n in sorted(data) if n.endswith('.jar')).encode()
          data['COMPATIBILITY.txt'] = (
              'Test-only MagicExpansion candidate against published v4.1.78 / r153.\n'
              'Minecraft 1.21.11 through 26.3; Java 21 bytecode.\n'
              f'MagicExpansion baseline: 1.1.19; candidate: {version}.\n'
              'All 43 other addon JARs are byte-identical to the published r153 archive.\n'
              'Preserve configs, player offers, cycle markers and purchase receipts.\n'
              'Stop and back up before replacing an existing JAR; never use /reload.\n'
              'This is an isolated CI preview (revision 154), NOT a published addon bundle.\n').encode()
          with zipfile.ZipFile('audit/candidate-addons.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for n in sorted(data):
                  info = zipfile.ZipInfo(n, (2026, 10, 15, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  out.writestr(info, data[n])
          with zipfile.ZipFile('audit/candidate-addons.zip') as out:
              unchanged = [n for n in original.namelist() if n.endswith('.jar') and 'MagicExpansion' not in n]
              assert len(unchanged) == 43 and all(out.read(n) == original.read(n) for n in unchanged)
              assert len([n for n in out.namelist() if n.endswith('.jar')]) == 44
          Path('audit/bundle-proof.json').write_text(json.dumps({'unchanged_addons': 43, 'source': manifest['addons'],
              'candidate_bundle_sha256': digest(Path('audit/candidate-addons.zip').read_bytes()),
              'candidate_jar_sha256': digest(jar_bytes), 'candidate_version': version,
              'bundle_revision': 154, 'publication': 'NOT_PUBLISHED'}, indent=2))
          script = Path('legacy-validation/scripts/full_stack_runtime_smoke.sh')
          text = script.read_text()
          needle = 'motd=Slimefun Legacy full-stack runtime smoke\n'
          assert text.count(needle) == 1
          script.write_text(text.replace(needle, needle + 'server-ip=127.0.0.1\nserver-port=0\n'))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Require all 44 addons across two full-stack boots
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          SLIMEFUN_SMOKE_VERSION: '4.1.78'
          PURPUR_SMOKE_BUILD: '2646'
          SERVER_DOWNLOAD_USER_AGENT: MagicExpansion-Full-Stack-Player-Flow/1.0
        run: |
          set -euo pipefail
          bash legacy-validation/scripts/full_stack_runtime_smoke.sh audit/Slimefun-Legacy4.1.78.jar audit/candidate-addons.zip audit/full-stack > audit/full-stack-runner.log 2>&1 || { tail -n 100 audit/full-stack-runner.log; exit 1; }
          test "$(wc -l < audit/full-stack/expected-addons.txt)" = 44
          test ! -s audit/full-stack/dependency-gated-addons.txt
          cat audit/full-stack/smoke-result.txt
      - name: Exercise purchases and a further full-stack restart
        run: |
          set -euo pipefail
          cp audit/BlackMarketPlayerFlowProbe.jar audit/full-stack/plugins/
          cd audit/full-stack
          sha256sum server.jar plugins/*.jar > flow-input-sha256.txt
          for PHASE in buy restart; do
            sha256sum -c flow-input-sha256.txt
            timeout --kill-after=20s 420s java -Xms768M -Xmx3G -Dblackmarket.offer.audit=true -Dblackmarket.flow.phase="$PHASE" -jar server.jar --nogui > "flow-${PHASE}.console.log" 2>&1
            test ! -e "flow-${PHASE}-fatal.txt" || { cat "flow-${PHASE}-fatal.txt"; tail -n 100 "flow-${PHASE}.console.log"; exit 1; }
            grep -Fxq PLAYER_FLOW_PASSED "flow-${PHASE}-result.txt"
            cat "flow-${PHASE}-result.txt"
          done
          test "$(grep '^pid=' flow-buy-result.txt)" != "$(grep '^pid=' flow-restart-result.txt)"
          python3 - <<'PY'
          import re
          from pathlib import Path
          for phase in ('buy', 'restart'):
              text = Path(f'flow-{phase}.console.log').read_text()
              errors = [line for line in text.splitlines() if re.search(r'\bERROR\]', line)]
              expected = 'Black Market trades locked for 2191f3af-0c91-3490-9d4e-66e1e790266b'
              if phase == 'buy':
                  assert len(errors) == 1 and expected in errors[0] and 'Black Market state changed outside this session:' in errors[0], errors
              else:
                  assert not errors, errors
              assert 'The server has stopped responding' not in text, 'Watchdog output is not a passing runtime test'
              assert 'Invalid or unreadable Black Market item' not in text
              assert not re.search(r'(ClassCastException|NoSuchMethodError|NoClassDefFoundError)', text)
          print('Both player-flow logs passed the strict error/watchdog audit')
          PY
      - name: Preserve candidate and full-stack evidence without publishing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magicexpansion-current-4178-r153-${{ matrix.lane }}
          path: |
            audit/*.log
            audit/*.json
            audit/*.txt
                        audit/full-stack/*.log
            audit/full-stack/*.txt
            audit/full-stack/plugins/BlackMarketPlayerFlowProbe/*.yml
            target/surefire-reports/TEST-*.xml
          if-no-files-found: error

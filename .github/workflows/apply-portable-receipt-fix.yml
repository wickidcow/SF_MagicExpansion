name: Apply isolated portable-shop receipt fix
on:
  push:
    branches: ['test/portable-shops-20261015']
    paths: ['.github/workflows/apply-portable-receipt-fix.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: apply-portable-receipt-fix
  cancel-in-progress: false
jobs:
  apply-and-test:
    if: github.repository == 'wickidcow/SF_MagicExpansion' && github.ref == 'refs/heads/test/portable-shops-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Commit only Java source edits to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$GITHUB_REF" = refs/heads/test/portable-shops-20261015
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python3 tests/portable-shop-audit/apply_receipt_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/Yomicer/magicExpansion/utils/shop/ShopManager.java src/main/java/io/Yomicer/magicExpansion/utils/shop/ShopGUI.java src/test/java/io/Yomicer/magicExpansion/utils/shop/ShopPurchaseLedgerTest.java tests/portable-shop-audit/PortableShopProbe.java
          git diff --cached --name-only | tee audit/committed-paths.txt
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'This token must not commit workflow changes'; exit 1; fi
          git commit -m 'fix: require saved portable-shop purchase counters before rewards and restore refused payments'
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/test/portable-shops-20261015
          git rev-parse HEAD > audit/pushed-source.txt
          git diff -- .github/workflows/portable-shop-audit.yml > audit/local-audit-workflow.patch
      - name: Test the pushed Java candidate with the local candidate-only runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install 'PyYAML==6.0.2'
          python3 - <<'PY'
          import os, subprocess, yaml
          data=yaml.safe_load(open('.github/workflows/portable-shop-audit.yml'))
          for step in data['jobs']['player-trades']['steps']:
              if 'run' in step:
                  print('EXECUTING:',step['name'],flush=True)
                  subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True,env=os.environ.copy())
          PY
      - name: Preserve exact candidate evidence without publishing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-shop-fixed-candidate-audit
          path: |
            audit/*.log
            audit/*.json
            audit/*.txt
            audit/*.patch
            audit/*.sha256
            audit/server/*.log
            audit/server/*.yml
            audit/server/*.txt
            audit/server/*.sha256
            audit/server/plugins/magicexpansion/portable_shops/*.yml
            target/surefire-reports/TEST-*.xml
          if-no-files-found: error

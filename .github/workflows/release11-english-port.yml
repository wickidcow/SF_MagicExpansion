name: Finalize MagicExpansion Release 11 English Port

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release11-english-port.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply Release 11 and English cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # Version and release identity.
          edit('pom.xml', [('<version>1.1.2</version>', '<version>1.1.3</version>')])
          edit('.github/workflows/build.yml', [
              ('LEGACY_ARTIFACT_VERSION: "1.1.2"', 'LEGACY_ARTIFACT_VERSION: "1.1.3"'),
              ('OUTPUT_NAME: "SF_MagicExpansion1.1.2.jar"', 'OUTPUT_NAME: "SF_MagicExpansion1.1.3.jar"'),
              ("grep -Fq '<version>1.1.2</version>' pom.xml", "grep -Fq '<version>1.1.3</version>' pom.xml"),
              ('target/MagicExpansion-Legacy-English-1.1.2.jar', 'target/MagicExpansion-Legacy-English-1.1.3.jar'),
              ('MagicExpansion Release 10 / Build 90 port for Slimefun Legacy.', 'MagicExpansion Release 11 / Build 91 port for Slimefun Legacy.'),
          ])
          edit('src/main/java/io/Yomicer/magicExpansion/core/MagicExpansionItems.java', [
              ('getGradientNameVer2("Version: Build 90")', 'getGradientNameVer2("Version: Build 91")'),
          ])

          # Upstream Release 11 removes this cancellation. The Legacy fork already
          # had it removed, but keep the port defensive against regression.
          edit('src/main/java/io/Yomicer/magicExpansion/Listener/fishingListener/PlayerFishingListener.java', [
              ('        e.setCancelled(true);\n', ''),
              ('// 所有鱼饵类型(优先级顺序)', '// All lure types in priority order'),
              ('// 鱼竿支持', '// Supported by this fishing rod'),
          ])

          # Equivalent no-water catch guard for the Legacy Water Cloud flow.
          water = Path('src/main/java/io/Yomicer/magicExpansion/Listener/fishingListener/PlayerFishingWaterCloudListener.java')
          text = water.read_text(encoding='utf-8')
          needle = '        if (!(sfItem instanceof FishingRodWaterCloud fishingRod)) return;\n\n        // 2.'
          if needle in text:
              text = text.replace(
                  needle,
                  '        if (!(sfItem instanceof FishingRodWaterCloud fishingRod)) return;\n\n'
                  '        // Release 11: Water Cloud catches require the hook to be in water.\n'
                  '        if (!isHookInWater(e.getHook().getLocation())) return;\n\n'
                  '        // 2.',
                  1
              )
          if 'private boolean isHookInWater(Location location)' not in text:
              method = '''\n    /**\n     * Checks whether the fishing hook is in water. The downward probe covers hooks\n     * resting exactly on the top edge of a water block.\n     */\n    private boolean isHookInWater(Location location) {\n        if (location.getBlock().getType() == Material.WATER) {\n            return true;\n        }\n        return location.clone().subtract(0, 0.1, 0).getBlock().getType() == Material.WATER;\n    }\n'''
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Could not locate Water Cloud listener closing brace')
              text = text[:pos] + method + text[pos:]
          water.write_text(text, encoding='utf-8')

          # Player-facing English cleanup discovered by the audit.
          edit('src/main/java/io/Yomicer/magicExpansion/utils/WaterCloudPoolMenu.java', [
              ('"淬霞"', '"Tempered Glow"'), ('"微尘"', '"Mote"'), ('"熔火"', '"Molten Flame"'),
              ('"跃金"', '"Leaping Gold"'), ('"星核"', '"Star Core"'), ('"蒹葭"', '"Reedflower"'),
              ('"芦雪"', '"Reed Snow"'), ('"苇露"', '"Reed Dew"'), ('"白露"', '"White Dew"'),
              ('"芦芽"', '"Reed Sprout"'), ('"凝霜"', '"Condensed Frost"'), ('"落絮"', '"Falling Catkin"'),
              ('"冰魄"', '"Ice Soul"'), ('"初霁"', '"First Clearing"'), ('"垂纶"', '"Angler Line"'),
              ('"风丝"', '"Wind Thread"'), ('"烟雨"', '"Misty Rain"'), ('"涟白"', '"White Ripple"'),
              ('"晓风"', '"Dawn Breeze"'), ('"斜影"', '"Slanting Shadow"'),
              ('"✦ 查看鱼饵池 ✦"', '"✦ View Lure Pool ✦"'),
              ('"点击查看当前鱼竿所有可用鱼饵"', '"Click to view all lures supported by this rod"'),
              ('"以及每个鱼饵的掉落物概率"', '"and the drop chance for each lure"'),
              ('"✦ 水云间 · 鱼饵池 ✦"', '"✦ Water Cloud · Lure Pool ✦"'),
              ('"§9✦ 水云间"', '"§9✦ Water Cloud"'), ('"§8暂无"', '"§8None"'),
              ('"§7可钓获的物品: §f" + pool.size() + "种"', '"§7Possible catches: §f" + pool.size()'),
              ('"§6 · 特殊物品概率: "', '"§6 · Special catch chance: "'),
              ('" §7为特殊钓物"', '" §7is the special catch"'),
              ('"§e点击查看掉落物概率"', '"§eClick to view drop chances"'),
              ('"§c关闭菜单"', '"§cClose Menu"'), ('"§7返回游戏"', '"§7Return to game"'),
              ('" · 掉落物"', '" · Drops"'), ('"§6第 "', '"§6Page "'), ('" 页"', '""'),
              ('"§e上一页"', '"§ePrevious Page"'), ('"§e下一页"', '"§eNext Page"'),
              ('"§b返回鱼饵列表"', '"§bBack to Lure List"'),
              ('"§e掉落概率: §f"', '"§eDrop chance: §f"'),
          ])

          edit('src/main/java/io/Yomicer/magicExpansion/utils/GuideMenuGroups.java', [
              ('"附属信息"', '"Addon Information"'), ('"点击查看贡献与更新日志"', '"Click to view credits and the changelog"'),
              ('"贡献"', '"Credits"'), ('"更新日志"', '"Changelog"'), ('"材料"', '"Materials"'),
              ('"点击查看资源与补丁材料"', '"Click to view resources and patch materials"'),
              ('"资源"', '"Resources"'), ('"补丁材料"', '"Patch Materials"'), ('"特殊物品"', '"Special Items"'),
              ('"点击查看特殊道具与联动分类"', '"Click to view special items and integrations"'),
              ('"特殊道具"', '"Special Tools"'), ('"魔法-SkyBlock"', '"Magic-SkyBlock"'), ('"纪念品"', '"Souvenirs"'),
              ('"特殊机器"', '"Special Machines"'), ('"点击查看机器分类"', '"Click to view machine categories"'),
              ('"快捷机器"', '"Quick Machines"'), ('"发电机"', '"Generators"'), ('"电力机器人"', '"Electric Robots"'),
              ('"魔法-1.21修复/优化~物品/机器"', '"Magic - 1.21 Fixes/Optimizations ~ Items/Machines"'),
              ('"功能机器"', '"Functional Machines"'),
              ('"点击查看生产机器与资源生成器"', '"Click to view production machines and resource generators"'),
              ('"资源生成器"', '"Resource Generators"'), ('"生产机器"', '"Production Machines"'), ('"魔法BOSS"', '"Magic Bosses"'),
              ('"预制菜"', '"Prefabs"'), ('"点击查看预制菜与建筑材料"', '"Click to view prefabs and building materials"'),
              ('"预制菜（建筑）"', '"Prefabs (Building)"'), ('"建筑材料"', '"Building Materials"'), ('"魔法锻造"', '"Magic Forging"'),
              ('"钓鱼佬"', '"Fishing"'), ('"点击查看织梦者与水云间"', '"Click to view Dreamweaver and Water Cloud"'),
              ('"织梦者"', '"Dreamweaver"'), ('"合成材料"', '"Crafting Materials"'), ('"鱼饵"', '"Lures"'),
              ('"鱼竿"', '"Fishing Rods"'), ('"钓鱼指南"', '"Fishing Guide"'), ('"水云间"', '"Water Cloud"'),
              ('"魔法作物"', '"Magic Crops"'), ('"点击查看美食与食材原料"', '"Click to view foods and ingredients"'),
              ('"美食"', '"Foods"'), ('"食材原料"', '"Ingredients"'), ('"魔法2.0-共创"', '"Magic 2.0 - Community"'),
              ('" · 入口"', '" · Entry"'), ('"点击查看子分类"', '"Click to view subcategories"'),
          ])

          edit('src/main/java/io/Yomicer/magicExpansion/utils/GuideCategoryMenu.java', [
              ('"MC人能飞！"', '"Minecraft players can fly!"'),
              ('" 感受到了魔法"', '" felt the magic."'), ('"来吃点糖吧"', '"Have some sugar."'),
              ('"堕入黑暗吧！"', '"Fall into the darkness!"'),
              ('"烟火入腹，人间忽而温柔。"', '"Fireworks within, and the world suddenly feels gentler."'),
              ('"袖底生风，山河退让半步。"', '"Wind gathers at your sleeve, and the mountains yield a step."'),
              ('"万籁俱寂，独此一瞬盛放。"', '"All falls silent as this one moment blooms."'),
              ('"哪来的B动静？"', '"What was that noise?"'),
              ('"你踩到了时间的衣角。"', '"You stepped on the hem of time."'),
              ('"今晚的月亮是甜的。"', '"Tonight\'s moon tastes sweet."'),
              ('"风把某个名字，吹到了你耳边。"', '"The wind carried a name to your ear."'),
              ('"有些门，只为回头的人开着。"', '"Some doors open only for those who look back."'),
              ('"它记得，你上一世也按过它。"', '"It remembers that you pressed it in another life."'),
              ('"海在很远的地方，替你翻了个身。"', '"Far away, the sea turned over in your stead."'),
              ('"这是钓鱼佬的馈赠"', '"A gift from the angler."'),
              ('"附属信息"', '"Addon Information"'), ('"点击查看贡献与更新日志"', '"Click to view credits and the changelog"'),
              ('"敬请期待"', '"Coming Soon"'), ('"神奇的小按钮"', '"Mysterious Little Button"'),
              ('"点一下会发生什么？"', '"What happens if you click it?"'), ('"这是魔法作者"', '"Author of MagicExpansion"'),
              ('"物品列表"', '"Item List"'), ('"§7需要研究解锁: §e"', '"§7Research required: §e"'),
              ('"§f点击: §7返回上一级"', '"§fClick: §7Back one level"'),
              ('"§fShift + 点击: §7返回主菜单"', '"§fShift + Click: §7Return to main menu"'),
              ('"§f点击: §7返回上一页"', '"§fClick: §7Previous page"'), ('"§7返回主菜单"', '"§7Return to main menu"'),
          ])

          edit('src/main/java/io/Yomicer/magicExpansion/items/tools/FishingRodWaterCloud.java', [
              ('"§d品级 · "', '"§dRarity · "'),
          ])

          edit('src/main/java/io/Yomicer/magicExpansion/items/misc/baitbag/BaitBagMenu.java', [
              ('"Reedflower钓"', '"Reedflower Rod"'), ('"鱼饵·Memory Fragment"', '"Lure · Memory Fragment"'),
              ('"§f这个鱼饵可以钓到任何物品"', '"§fThis lure can catch almost anything."'),
              ('"§f他存在于过去或者是未来"', '"§fIt exists somewhere in the past—or the future."'),
              ('"§f你现在看到的他并非真正的他"', '"§fWhat you see now may not be its true form."'),
              ('"饵料袋不在背包中"', '"The Lure Bag is not in your inventory."'), ('"✦ 饵料袋 ✦"', '"✦ Lure Bag ✦"'),
              ('"输入槽"', '"Input Slot"'), ('"云梦袋"', '"Cloud Dream Bag"'),
              ('"左键放入对应鱼饵"', '"Left-click to insert the matching lure"'),
              ('"空手左键取出1个"', '"Left-click with an empty hand to take 1"'),
              ('"Shift+左键取出全部(最多3456)"', '"Shift + Left-click to take all (max 3456)"'),
              ('"右键循环调整优先级"', '"Right-click to cycle priority"'), ('"优先级 1~"', '"Priority 1~"'),
              ('"该鱼竿消耗以下鱼饵"', '"This rod uses the following lures"'), ('"库存："', '"Stored: "'),
              ('"优先级："', '"Priority: "'),
              ('"空手左键取出1 · 左键放入 · Shift取出(≤3456) · 右键优先级"', '"Empty-hand Left-click: take 1 · Left-click: insert · Shift: take all (≤3456) · Right-click: priority"'),
              ('"请手持对应的鱼饵点击槽位"', '"Hold the matching lure and click the slot."'),
              ('"这不是该槽位的鱼饵"', '"That lure does not belong in this slot."'),
              ('"已从以太秘匣取出鱼饵"', '"Lure withdrawn from the Aether Cache."'),
              ('"已从量子存储取出鱼饵"', '"Lure withdrawn from Quantum Storage."'),
              ('"饵料袋读取量子存储数据失败: "', '"Lure Bag failed to read Quantum Storage data: "'),
          ])

          # Translate comments in the touched Water Cloud listener without changing identifiers.
          edit('src/main/java/io/Yomicer/magicExpansion/Listener/fishingListener/PlayerFishingWaterCloudListener.java', [
              ('水云间系列专属钓鱼监听', 'Dedicated fishing listener for the Water Cloud rod series'),
              ('与 PlayerFishingListener 相互独立,各自处理各自的鱼竿钓鱼事件', 'Independent from PlayerFishingListener; each listener handles its own rod family.'),
              ('水云间系列鱼饵(当前鱼饵作为特殊事件判定依据)', 'Water Cloud lure list; the active lure determines special-catch behavior.'),
              ('水云间专属钓获提示词(普通钓物)', 'Water Cloud normal-catch messages.'),
              ('水云间特殊事件提示词(钓到特殊钓物时)', 'Water Cloud special-catch messages.'),
              ('水云间消耗鱼饵提示词(前缀 + 饵名 + ！)', 'Water Cloud lure-consumption messages.'),
              ('水云间最后一组鱼饵提示词(接在饵名之后)', 'Water Cloud final-lure messages.'),
              ('入口: 水云间鱼竿钓鱼事件', 'Entry point for Water Cloud fishing events.'),
              ('水云间钓鱼主流程', 'Main Water Cloud fishing flow.'),
              ('无鱼饵 → 按原版普通鱼竿走(不干预,保留原版钓获)', 'No lure: leave vanilla fishing untouched.'),
              ('有鱼饵 → 按战利品池随机钓获;钓起的物品中被标记为特殊事件入口的 → 特殊事件,否则普通事件', 'With a lure: roll the configured loot pool; tagged catches trigger special handling.'),
              ('判定是否水云间系列鱼竿', 'Verify this is a Water Cloud fishing rod.'),
              ('获取当前鱼饵(副手优先,其次背包)', 'Resolve the active lure: offhand first, then inventory.'),
              ('没有鱼饵 → 按原版普通鱼竿走,不干预原版钓获', 'No lure: preserve vanilla fishing behavior.'),
              ('使用原本的战利品池加权随机逻辑获取钓获物', 'Roll the existing weighted loot pool.'),
              ('移除原版钓获实体,改为掉落本次战利品', 'Remove the vanilla catch entity and spawn the selected reward.'),
              ('消耗鱼饵(水云间提示)', 'Consume the lure and show the Water Cloud message.'),
              ('在鱼钩位置生成掉落物', 'Spawn the reward at the hook location.'),
              ('钓起的物品中被标记为特殊事件入口的 → 特殊事件;否则普通事件', 'Route tagged catches to the special event; otherwise use normal handling.'),
              ('获取当前使用的鱼饵(副手优先,其次背包搜索)', 'Find the active lure: offhand first, then inventory.'),
              ('获取本次钓获物(沿用原本的战利品池加权随机逻辑)', 'Select this catch using the existing weighted loot logic.'),
              ('当前鱼饵对应的特殊钓物(显式映射,即被标记为特殊事件入口的物品)', 'Map the active lure to its special catch.'),
              ('修复: 返回 clone 而非 MagicExpansionItems 的 static 单例——', 'Return a clone rather than mutating the shared MagicExpansionItems instance.'),
              ('蓄满分支/双倍鱼获会 setAmount 修改 drop, 直接返回单例会被污染并随掉落物扩散。', 'Catch modifiers can change stack size, so shared item instances must never be returned directly.'),
              ('在鱼钩位置生成掉落物(沿用原本的掉落方式)', 'Spawn the catch at the hook using the existing drop behavior.'),
              ('普通钓物 → 普通事件(水云间专属钓获提示)', 'Normal catch: show the Water Cloud catch message.'),
              ('原版获得经验音效', 'Vanilla experience pickup sound.'),
              ('特殊钓物 → 特殊事件(专属提示,后续可继续加表现)', 'Special catch: show the dedicated message and effects.'),
              ('从玩家脚底发射一枚无伤害的庆祝烟花', 'Launch a harmless celebration firework from the player.'),
              ('从玩家脚底发射一枚装饰性烟花(无伤害,仅庆祝特效)', 'Launch a decorative, harmless celebration firework.'),
          ])

          # Player-facing audit. Two CJK strings are intentionally retained only as
          # internal compatibility keys: the legacy final-rod language key and an
          # old Chinese menu-title matcher used to recognize existing installations.
          cjk = re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]')
          allowed_internal = ('南柯一梦终须醒_浮生若梦皆是空', 'strippedTitle.contains("水云间")')
          offenders = []
          for java in Path('src/main/java').rglob('*.java'):
              src = java.read_text(encoding='utf-8', errors='ignore')
              src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
              src = re.sub(r'//.*', '', src)
              for lineno, line in enumerate(src.splitlines(), 1):
                  if cjk.search(line) and '"' in line and not any(x in line for x in allowed_internal):
                      offenders.append(f'{java}:{lineno}: {line.strip()}')
          for res in Path('src/main/resources').rglob('*'):
              if not res.is_file() or res.suffix.lower() not in {'.yml', '.yaml', '.json', '.txt', '.properties'}:
                  continue
              for lineno, line in enumerate(res.read_text(encoding='utf-8', errors='ignore').splitlines(), 1):
                  if cjk.search(line) and '南柯一梦终须醒_浮生若梦皆是空:' not in line:
                      offenders.append(f'{res}:{lineno}: {line.strip()}')
          if offenders:
              print('Non-English player-facing text still detected:')
              print('\n'.join(offenders[:250]))
              raise SystemExit(2)
          print('English player-facing audit passed.')

      - name: Build against Paper 26.2
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=26.2.build.111-stable clean package

      - name: Commit finalized port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml .github/workflows/build.yml src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo 'Release 11 English port is already applied.'
            exit 0
          fi
          git commit -m 'Release SF_MagicExpansion 1.1.3 - upstream Release 11'
          git push origin HEAD:master

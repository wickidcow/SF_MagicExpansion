name: Promote verified MagicExpansion 1.1.14
on:
  push:
    branches: ['release/promote-verified-1.1.14-20261015']
    paths: ['.github/workflows/promote-verified-1.1.14.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: promote-exact-magicexpansion-1.1.14
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the existing draft by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          REPO='wickidcow/SF_MagicExpansion'
          SOURCE='1876e699b4557ab144bc36c4d8b6682aeb93e17d'
          MERGE='481e6c090baa28fc8a4b3a44b6155d236f28bf33'
          SHA='e3552fc5d54dc282194428d593d08c939f71172182075667ac87d10571b192dd'
          RELEASE=413712308
          ASSET=643600640
          assert os.environ['GITHUB_REPOSITORY']==REPO
          assert os.environ['GITHUB_REF']=='refs/heads/release/promote-verified-1.1.14-20261015'
          def gh(*args): return subprocess.check_output(['gh',*args])
          def api(path): return json.loads(gh('api',f'repos/{REPO}/{path}'))
          pr=api('pulls/20')
          assert pr['merged'] and pr['head']['sha']==SOURCE and pr['merge_commit_sha']==MERGE
          assert api('git/ref/heads/master')['object']['sha']==MERGE
          assert api(f'git/commits/{MERGE}')['tree']['sha']==api(f'git/commits/{SOURCE}')['tree']['sha']
          for run_id in (38675709884,38675710097,38675710136,38675710068):
              run=api(f'actions/runs/{run_id}')
              assert run['head_sha']==SOURCE and run['status']=='completed' and run['conclusion']=='success'
          old=api('releases/tags/v1.1.13')
          old_assets={a['id']:(a['name'],a['digest'],a['size']) for a in old['assets']}
          assert old['id']==413342162 and old_assets[642331738][1]=='sha256:674aeac4dbf5ce09969131dbfdbadd1e037eebfed74588f98f135902ab81adde'
          draft=api(f'releases/{RELEASE}')
          assert draft['draft'] and draft['tag_name']=='v1.1.14' and draft['target_commitish']==SOURCE
          assert len(draft['assets'])==1 and draft['assets'][0]['id']==ASSET and draft['assets'][0]['digest']=='sha256:'+SHA
          before=gh('api',f'repos/{REPO}/releases/assets/{ASSET}','-H','Accept: application/octet-stream')
          assert hashlib.sha256(before).hexdigest()==SHA, 'Draft bytes did not match tested artifact'
          gh('api','--method','PATCH',f'repos/{REPO}/releases/{RELEASE}','-F','draft=false','-f','make_latest=true')
          published=api(f'releases/{RELEASE}')
          assert not published['draft'] and not published['prerelease'] and published['tag_name']=='v1.1.14'
          after=gh('api',f'repos/{REPO}/releases/assets/{ASSET}','-H','Accept: application/octet-stream')
          assert after==before and hashlib.sha256(after).hexdigest()==SHA
          assert {a['id']:(a['name'],a['digest'],a['size']) for a in api('releases/tags/v1.1.13')['assets']}==old_assets
          receipt={'status':'PUBLISHED_AND_DOWNLOADED_VERIFIED','release_url':published['html_url'],'release_id':RELEASE,'asset_id':ASSET,'source':SOURCE,'merge':MERGE,'jar':'SF_MagicExpansion1.1.14.jar','sha256':SHA,'previous_release_unchanged':True,'production_deployment':False}
          pathlib.Path('publication-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Keep publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magicexpansion-1.1.14-publication
          path: publication-receipt.json
          if-no-files-found: warn

name: Complete MagicExpansion Release 11 Port

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release11-final-pass.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply final English fixes and Release 11 port
        shell: python
        run: |
          from pathlib import Path

          # Fix the only two player-facing strings left by the previous audit.
          pool = Path('src/main/java/io/Yomicer/magicExpansion/utils/WaterCloudPoolMenu.java')
          text = pool.read_text(encoding='utf-8').replace('"§7第 "', '"§7Page "')
          pool.write_text(text, encoding='utf-8')

          # Reuse the already-reviewed Release 11 + English cleanup script from the
          # prior workflow, so this pass stays small and only corrects the audit gap.
          workflow = Path('.github/workflows/release11-english-port.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == '- name: Apply Release 11 and English cleanup')
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
          script_lines = []
          for line in workflow[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              script_lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(script_lines)
          exec(compile(script, 'release11-english-port.yml', 'exec'), {})

      - name: Build against Paper 26.2
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=26.2.build.111-stable clean package

      - name: Commit completed Release 11 port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml .github/workflows/build.yml src/main/java src/main/resources
          git commit -m 'Release SF_MagicExpansion 1.1.3 - upstream Release 11'
          git push origin HEAD:master

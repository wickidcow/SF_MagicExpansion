name: MagicExpansion item catalog runtime audit

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'tests/runtime/ItemCatalogProbe.java'
      - 'tests/runtime/MachineTransactionProbe.java'
      - '.github/workflows/item-catalog-runtime.yml'
  push:
    branches: ['audit/item-feature-verification-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magicexpansion-item-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  item-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {software: paper, minecraft: '1.21.11', java: '21', lane: 'paper-1.21.11'}
          - {software: paper, minecraft: '26.2', java: '25', lane: 'paper-26.2'}
          - {software: paper, minecraft: '26.3', java: '25', lane: 'paper-26.3'}
          - {software: purpur, minecraft: '26.3', java: '25', lane: 'purpur-26.3'}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: 50ba75921a18ca0a83434ac242cd7bb18dc3c370
          path: legacy-validation
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build exact MagicExpansion source and audit plugin
        run: |
          set -euo pipefail
          mkdir -p audit/classes/item-catalog audit/classes/machine-transaction
          git rev-parse HEAD > audit/source-commit.txt
          bash scripts/install_slimefun_api.sh > audit/build.log 2>&1
          mvn -B -ntp clean verify >> audit/build.log 2>&1 || { tail -n 120 audit/build.log; exit 1; }
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=classpath.txt >> audit/build.log 2>&1
          CANDIDATE="$(find target -maxdepth 1 -type f -name 'SF_MagicExpansion*.jar' -print -quit)"
          test -s "$CANDIDATE"
          javac --release 21 -cp "$CANDIDATE:$(cat classpath.txt)" -d audit/classes/item-catalog tests/runtime/ItemCatalogProbe.java
          printf "name: MagicExpansionItemCatalogProbe\nmain: audit.ItemCatalogProbe\nversion: '1'\napi-version: '1.21.11'\ndepend: [Slimefun, magicexpansion]\n" > audit/classes/item-catalog/plugin.yml
          jar --create --file audit/ItemCatalogProbe.jar -C audit/classes/item-catalog .
          javac --release 21 -cp "$CANDIDATE:$(cat classpath.txt)" -d audit/classes/machine-transaction tests/runtime/MachineTransactionProbe.java
          printf "name: MagicExpansionMachineTransactionProbe\nmain: audit.MachineTransactionProbe\nversion: '1'\napi-version: '1.21.11'\ndepend: [Slimefun, magicexpansion]\n" > audit/classes/machine-transaction/plugin.yml
          jar --create --file audit/MachineTransactionProbe.jar -C audit/classes/machine-transaction .

      - name: Build disposable full 45-addon bundle with exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/release
          gh api repos/wickidcow/Slimefun-Legacy/releases/tags/v4.1.74 > audit/release.json
          gh release download v4.1.74 --repo wickidcow/Slimefun-Legacy \
            --pattern 'Slimefun-Legacy4.1.74.jar' \
            --pattern 'SF_Addons_1.21.11-26.3.zip' \
            --dir audit/release
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path

          release=json.loads(Path('audit/release.json').read_text())
          assets={a['name']:a for a in release['assets']}
          for name in ('Slimefun-Legacy4.1.74.jar','SF_Addons_1.21.11-26.3.zip'):
              path=Path('audit/release')/name
              assert path.is_file() and path.stat().st_size>0
              digest='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
              assert assets[name].get('digest')==digest, (name,digest,assets[name].get('digest'))

          candidate=list(Path('target').glob('SF_MagicExpansion*.jar'))
          assert len(candidate)==1
          candidate=candidate[0]
          jar_bytes=candidate.read_bytes()
          jar_sha=hashlib.sha256(jar_bytes).hexdigest()
          with zipfile.ZipFile(candidate) as jar:
              descriptor=jar.read('plugin.yml').decode('utf-8')
              version=re.search(r'''(?m)^version:\s*['"]?([^'"\s]+)''',descriptor).group(1)
              assert not any(n.startswith(('audit/','org/junit/','org/mockbukkit/')) for n in jar.namelist())

          original_path=Path('audit/release/SF_Addons_1.21.11-26.3.zip')
          with zipfile.ZipFile(original_path) as original:
              members={n:original.read(n) for n in original.namelist()}
              manifest=json.loads(members['SF_ADDON_MANIFEST.json'])
              assert len(manifest['addons'])==45
              rows=[r for r in manifest['addons'] if r['repository']=='wickidcow/SF_MagicExpansion']
              assert len(rows)==1
              old_jar=rows[0]['jar']
              old_other={n:members[n] for n in members if n.endswith('.jar') and n!=old_jar}
              assert len(old_other)==44
              del members[old_jar]
              rows[0].update(
                  jar=candidate.name,
                  source_jar=candidate.name,
                  version=version,
                  sha256=jar_sha,
                  commit=Path('audit/source-commit.txt').read_text().strip(),
              )
              members[candidate.name]=jar_bytes
              manifest['item_catalog_audit']={
                  'repository':'wickidcow/SF_MagicExpansion',
                  'candidate_commit':Path('audit/source-commit.txt').read_text().strip(),
                  'candidate_sha256':jar_sha,
                  'publication':'NOT_PUBLISHED',
              }
              members['SF_ADDON_MANIFEST.json']=(json.dumps(manifest,indent=2)+'\n').encode()
              members['SHA256SUMS.txt']=''.join(
                  f"{hashlib.sha256(members[n]).hexdigest()}  {n}\n"
                  for n in sorted(members) if n.endswith('.jar')
              ).encode()
              members['COMPATIBILITY.txt'] += (
                  '\nDisposable MagicExpansion item catalog candidate; not a release asset.\n'
              ).encode()
          with zipfile.ZipFile('audit/item-audit-bundle.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in sorted(members):
                  info=zipfile.ZipInfo(n,(2026,10,15,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  out.writestr(info,members[n])
          with zipfile.ZipFile('audit/item-audit-bundle.zip') as out:
              names=[n for n in out.namelist() if n.endswith('.jar')]
              assert len(names)==45
              assert candidate.name in names
              assert all(out.read(n)==blob for n,blob in old_other.items())
          PY
          cp audit/release/Slimefun-Legacy4.1.74.jar audit/Slimefun-Legacy4.1.74.jar
          python3 - <<'PY'
          from pathlib import Path
          p=Path('legacy-validation/scripts/full_stack_runtime_smoke.sh')
          text=p.read_text()
          needle='motd=Slimefun Legacy full-stack runtime smoke\n'
          assert text.count(needle)==1
          p.write_text(text.replace(needle,needle+'server-ip=127.0.0.1\nserver-port=0\n'))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Boot exact 45-addon candidate twice
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          SLIMEFUN_SMOKE_VERSION: '4.1.74'
          PURPUR_SMOKE_BUILD: '2646'
          SERVER_DOWNLOAD_USER_AGENT: MagicExpansion-Item-Catalog/1.0
        run: |
          set -euo pipefail
          bash legacy-validation/scripts/full_stack_runtime_smoke.sh \
            audit/Slimefun-Legacy4.1.74.jar \
            audit/item-audit-bundle.zip \
            audit/full-stack > audit/runtime-smoke.log 2>&1 || { tail -n 160 audit/runtime-smoke.log; exit 1; }
          grep -Fq 'runtime smoke: PASS' audit/full-stack/smoke-result.txt
          test "$(wc -l < audit/full-stack/expected-addons.txt)" = 45
          test ! -s audit/full-stack/dependency-gated-addons.txt

      - name: Audit every registered MagicExpansion item
        run: |
          set -euo pipefail
          cp audit/ItemCatalogProbe.jar audit/full-stack/plugins/
          cd audit/full-stack
          timeout --kill-after=20s 420s java -Xms768M -Xmx3G -jar server.jar --nogui > item-catalog.console.log 2>&1
          test -s item-catalog-result.txt
          cat item-catalog-result.txt
          grep -Fxq ITEM_CATALOG_PASS <(head -n 1 item-catalog-result.txt)
          ! grep -Eq 'ITEM_CATALOG_FATAL|NoSuchMethodError|NoClassDefFoundError|Error occurred while enabling|Could not load plugin' item-catalog.console.log

      - name: Exercise electric recipe and resource machines
        run: |
          set -euo pipefail
          rm -f audit/full-stack/plugins/ItemCatalogProbe.jar
          cp audit/MachineTransactionProbe.jar audit/full-stack/plugins/
          cd audit/full-stack
          timeout --kill-after=20s 420s java -Xms768M -Xmx3G -jar server.jar --nogui > machine-transaction.console.log 2>&1
          test -s machine-transaction-result.txt
          cat machine-transaction-result.txt
          grep -Fxq MACHINE_TRANSACTION_PASS <(head -n 1 machine-transaction-result.txt)
          ! grep -Eq 'MACHINE_TRANSACTION_FATAL|NoSuchMethodError|NoClassDefFoundError|Error occurred while enabling|Could not load plugin' machine-transaction.console.log

      - name: Preserve item catalog evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magicexpansion-item-catalog-${{ matrix.lane }}
          path: |
            audit/build.log
            audit/runtime-smoke.log
            audit/item-audit-bundle.zip
            audit/full-stack/item-catalog-result.txt
            audit/full-stack/item-catalog.tsv
            audit/full-stack/item-catalog.console.log
            audit/full-stack/machine-transaction-result.txt
            audit/full-stack/machine-transaction.console.log
            audit/full-stack/smoke-result.txt
            target/surefire-reports/TEST-*.xml
          if-no-files-found: warn

name: MagicExpansion item catalog runtime audit

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'tests/runtime/ItemCatalogProbe.java'
      - '.github/workflows/item-catalog-runtime.yml'
  push:
    branches: ['audit/item-feature-verification-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magicexpansion-item-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  item-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {software: paper, minecraft: '1.21.11', java: '21', lane: 'paper-1.21.11'}
          - {software: paper, minecraft: '26.2', java: '25', lane: 'paper-26.2'}
          - {software: paper, minecraft: '26.3', java: '25', lane: 'paper-26.3'}
          - {software: purpur, minecraft: '26.3', java: '25', lane: 'purpur-26.3'}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: 50ba75921a18ca0a83434ac242cd7bb18dc3c370
          path: legacy-validation
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build exact MagicExpansion source and audit plugin
        run: |
          set -euo pipefail
          mkdir -p audit/classes audit/bundle
          git rev-parse HEAD > audit/source-commit.txt
          bash scripts/install_slimefun_api.sh > audit/build.log 2>&1
          mvn -B -ntp clean verify >> audit/build.log 2>&1 || { tail -n 120 audit/build.log; exit 1; }
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=classpath.txt >> audit/build.log 2>&1
          CANDIDATE="$(find target -maxdepth 1 -type f -name 'SF_MagicExpansion*.jar' -print -quit)"
          test -s "$CANDIDATE"
          javac --release 21 -cp "$CANDIDATE:$(cat classpath.txt)" -d audit/classes tests/runtime/ItemCatalogProbe.java
          printf "name: MagicExpansionItemCatalogProbe\nmain: audit.ItemCatalogProbe\nversion: '1'\napi-version: '1.21.11'\ndepend: [Slimefun, magicexpansion]\n" > audit/classes/plugin.yml
          jar --create --file audit/ItemCatalogProbe.jar -C audit/classes .
          cp "$CANDIDATE" audit/bundle/
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path

          jars=list(Path('audit/bundle').glob('SF_MagicExpansion*.jar'))
          assert len(jars)==1
          jar=jars[0]
          with zipfile.ZipFile(jar) as archive:
              descriptor=archive.read('plugin.yml').decode()
              version=re.search(r'''(?m)^version:\s*['"]?([^'"\s]+)''', descriptor).group(1)
          digest=hashlib.sha256(jar.read_bytes()).hexdigest()
          commit=Path('audit/source-commit.txt').read_text().strip()
          manifest={
              'bundle':'MagicExpansion item audit',
              'bundle_revision':1,
              'core_source_commit':'4f8aa1e9c288751aeefb9a9f72dbac17a6322b5a',
              'compatibility':{'minecraft_versions':{'minimum':'1.21.11','primary':'26.3'}},
              'addons':[{
                  'repository':'wickidcow/SF_MagicExpansion',
                  'commit':commit,
                  'jar':jar.name,
                  'source_jar':jar.name,
                  'version':version,
                  'sha256':digest
              }]
          }
          Path('audit/bundle/SF_ADDON_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('audit/bundle/SHA256SUMS.txt').write_text(f'{digest}  {jar.name}\n')
          Path('audit/bundle/COMPATIBILITY.txt').write_text('Disposable MagicExpansion item catalog audit bundle.\n')
          with zipfile.ZipFile('audit/item-audit-bundle.zip','w',zipfile.ZIP_DEFLATED) as out:
              for path in sorted(Path('audit/bundle').iterdir()):
                  out.write(path,path.name)
          PY
          curl -fL --retry 3 'https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.74/Slimefun-Legacy4.1.74.jar' -o audit/Slimefun-Legacy4.1.74.jar
          echo '72a524d7c0d6f75a9decbf06679515887273ae53673d3f5ee38f355bef952c96  audit/Slimefun-Legacy4.1.74.jar' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('legacy-validation/scripts/full_stack_runtime_smoke.sh')
          text=p.read_text()
          needle='motd=Slimefun Legacy full-stack runtime smoke\n'
          assert text.count(needle)==1
          p.write_text(text.replace(needle, needle+'server-ip=127.0.0.1\nserver-port=0\n'))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Boot Slimefun and MagicExpansion twice
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          SLIMEFUN_SMOKE_VERSION: '4.1.74'
          PURPUR_SMOKE_BUILD: '2646'
          SERVER_DOWNLOAD_USER_AGENT: MagicExpansion-Item-Catalog/1.0
        run: |
          set -euo pipefail
          bash legacy-validation/scripts/full_stack_runtime_smoke.sh \
            audit/Slimefun-Legacy4.1.74.jar \
            audit/item-audit-bundle.zip \
            audit/full-stack > audit/runtime-smoke.log 2>&1 || { tail -n 120 audit/runtime-smoke.log; exit 1; }
          grep -Fq 'runtime smoke: PASS' audit/full-stack/smoke-result.txt

      - name: Audit every registered MagicExpansion item
        run: |
          set -euo pipefail
          cp audit/ItemCatalogProbe.jar audit/full-stack/plugins/
          cd audit/full-stack
          timeout --kill-after=20s 420s java -Xms512M -Xmx2G -jar server.jar --nogui > item-catalog.console.log 2>&1
          test -s item-catalog-result.txt
          cat item-catalog-result.txt
          grep -Fxq ITEM_CATALOG_PASS <(head -n 1 item-catalog-result.txt)
          ! grep -Eq 'ITEM_CATALOG_FATAL|NoSuchMethodError|NoClassDefFoundError|Error occurred while enabling|Could not load plugin' item-catalog.console.log

      - name: Preserve item catalog evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magicexpansion-item-catalog-${{ matrix.lane }}
          path: |
            audit/build.log
            audit/runtime-smoke.log
            audit/full-stack/item-catalog-result.txt
            audit/full-stack/item-catalog.tsv
            audit/full-stack/item-catalog.console.log
            audit/full-stack/smoke-result.txt
            target/surefire-reports/TEST-*.xml
          if-no-files-found: warn

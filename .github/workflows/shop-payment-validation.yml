name: Portable Shop Payment Validation

on:
  push:
    branches: ['work/shop-payment-validation-20261001']
    paths: ['.audit/**', '.github/workflows/shop-payment-validation.yml']

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Supply exact revision 97 core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence runtime-inputs
          python3 - <<'PY'
          import hashlib, io, json, subprocess, zipfile
          from pathlib import Path
          endpoint = 'repos/wickidcow/Slimefun-Legacy/actions/artifacts/11138864515'
          def api(path):
              return subprocess.run(['gh', 'api', path], check=True, capture_output=True, timeout=120).stdout
          meta = json.loads(api(endpoint))
          assert meta['workflow_run']['head_sha'] == '78ec1b049c9b54fdf7a108c59c028605af417b4f'
          raw = api(endpoint + '/zip')
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == 'a7941fea94a3d02b4fea402100323e0dbc4b03c45da3f631c87c9b9a0ff9a8de'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names = [n for n in z.namelist() if n.endswith('.jar')]
              assert len(names) == 1
              jar = z.read(names[0])
          with zipfile.ZipFile(io.BytesIO(jar)) as z:
              assert 'plugin.yml' in z.namelist() and z.testzip() is None
          Path('runtime-inputs/core.jar').write_bytes(jar)
          Path('evidence/core.json').write_text(json.dumps(dict(artifact_id=11138864515, head=meta['workflow_run']['head_sha'], artifact_sha256=digest, jar_sha256=hashlib.sha256(jar).hexdigest()), indent=2))
          PY
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile=runtime-inputs/core.jar -DgroupId=com.github.wickidcow -DartifactId=Slimefun-Legacy -Dversion=4.1.62-audit -Dpackaging=jar -DgeneratePom=true
      - name: Build unchanged addon for the runtime negative control
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests -Dslimefun.version=4.1.62-audit clean package > evidence/original-build.log 2>&1
          cp target/SF_MagicExpansion1.1.7.jar runtime-inputs/original.jar
      - name: Apply exact reviewed payment and page changes
        run: |
          python3 .audit/apply_shop_payment.py
          git diff --check
      - name: Full corrected build and permanent regression tests
        run: |
          set -euo pipefail
          mvn -B -ntp -Dslimefun.version=4.1.62-audit clean verify 2>&1 | tee evidence/corrected-build.log
          cp target/SF_MagicExpansion1.1.7.jar runtime-inputs/candidate.jar
          cp -r target/surefire-reports evidence/test-results
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET, zipfile, struct, hashlib
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          roots = [ET.parse(p).getroot() for p in reports]
          totals = {k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert totals == dict(tests=18,failures=0,errors=0,skipped=0), totals
          jar = Path('runtime-inputs/candidate.jar')
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.class') and not name.startswith('META-INF/versions/'):
                      assert struct.unpack('>H', z.read(name)[6:8])[0] <= 65, name
                  assert not name.startswith(('org/junit/', 'org/mockbukkit/')), name
          totals['jar_sha256'] = hashlib.sha256(jar.read_bytes()).hexdigest()
          Path('evidence/result.json').write_text(json.dumps(totals, indent=2))
          PY
      - name: Stage exact tested source blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          names = ['pom.xml','.github/workflows/build.yml','src/main/java/io/Yomicer/magicExpansion/utils/shop/ShopGUI.java','src/main/java/io/Yomicer/magicExpansion/utils/shop/InventoryPayment.java','src/test/java/io/Yomicer/magicExpansion/utils/shop/InventoryPaymentTest.java','src/test/java/io/Yomicer/magicExpansion/utils/shop/ShopPageTest.java']
          records={}
          for name in names:
              data=Path(name).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=subprocess.run(['gh','api','--method','POST','repos/${{ github.repository }}/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(result.stdout)['sha']==sha
              records[name]=sha
              path=Path('evidence/reviewed-source')/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shop-payment-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: shop-payment-runtime-inputs
          path: runtime-inputs/
          retention-days: 14
          if-no-files-found: error

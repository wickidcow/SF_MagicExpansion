name: Shop Handler Preservation Runtime

on:
  push:
    branches: ['work/shop-payment-validation-20261001']
    paths: ['.github/workflows/shop-handler-runtime.yml']

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            build: 132
            java: '21'
            server_sha: 5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba
          - minecraft: '26.2'
            build: 129
            java: '25'
            server_sha: b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083
          - minecraft: '26.3'
            build: 140
            java: '25'
            server_sha: 98aabc113a80b9b5e183475e839a17cf99c39c915a1f46b8f35a5e89fd5de0f1
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify inputs and fix only the fixture descriptor dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-inputs evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, json, subprocess, zipfile
          raw = subprocess.run(['gh','api','repos/wickidcow/SF_MagicExpansion/actions/artifacts/11151644957/zip'],check=True,capture_output=True,timeout=120).stdout
          assert hashlib.sha256(raw).hexdigest() == 'd2972acbb676ada7e21d2a703ed22766c2bf4b47889801681841d1cb264179ee'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name in ['core.jar','original.jar','candidate.jar','probe.jar','input-sha256.json','probe-sha256.txt']:
                  Path('runtime-inputs',name).write_bytes(archive.read(name))
          hashes=json.loads(Path('runtime-inputs/input-sha256.json').read_text())
          for name, expected in hashes.items():
              assert hashlib.sha256(Path('runtime-inputs',name).read_bytes()).hexdigest()==expected
          assert hashes['candidate.jar']=='491619a0acf6a564cd2242ab84d62eddb6d7688e8623530af0ef6bc2d71db111'
          with zipfile.ZipFile('runtime-inputs/candidate.jar') as addon:
              assert 'name: magicexpansion' in addon.read('plugin.yml').decode()
          path=Path('runtime-inputs/probe.jar')
          records={}
          output=io.BytesIO()
          with zipfile.ZipFile(path) as source, zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as destination:
              for name in source.namelist():
                  data=source.read(name)
                  if name=='plugin.yml':
                      assert data.count(b'depend: [Slimefun, MagicExpansion]')==1
                      data=data.replace(b'depend: [Slimefun, MagicExpansion]',b'depend: [Slimefun, magicexpansion]')
                  else:
                      records[name]=hashlib.sha256(data).hexdigest()
                  destination.writestr(name,data)
          path.write_bytes(output.getvalue())
          with zipfile.ZipFile(path) as target:
              assert all(hashlib.sha256(target.read(name)).hexdigest()==digest for name,digest in records.items())
          Path('evidence/fixture-change.json').write_text(json.dumps(dict(change='Only fixture dependency casing; plugin sources and probe classes unchanged',unchanged_entries=records,probe_sha256=hashlib.sha256(path.read_bytes()).hexdigest()),indent=2))
          PY
      - name: Run real original and corrected shop handlers
        env:
          MINECRAFT: ${{ matrix.minecraft }}
          BUILD: ${{ matrix.build }}
          SERVER_SHA: ${{ matrix.server_sha }}
        run: |
          set -euo pipefail
          URL="https://fill-data.papermc.io/v1/objects/${SERVER_SHA}/paper-${MINECRAFT}-${BUILD}.jar"
          printf 'minecraft=%s\nbuild=%s\nurl=%s\nsha256=%s\nmetadata_source_run=36808369424\n' "$MINECRAFT" "$BUILD" "$URL" "$SERVER_SHA" > evidence/server-provenance.txt
          curl --fail-with-body -L -sS --retry 3 --retry-delay 5 --max-time 120 -H 'User-Agent: Slimefun-Legacy-Preservation/4.1.62 (https://github.com/wickidcow/Slimefun-Legacy)' "$URL" -o server.jar
          printf '%s  server.jar\n' "$SERVER_SHA" | sha256sum --check
          sha256sum server.jar runtime-inputs/*.jar > evidence/input-sha256.txt
          cp runtime-inputs/input-sha256.json runtime-inputs/probe-sha256.txt evidence/
          for KIND in original candidate; do
            ROOT="$PWD/runtime-$KIND"
            mkdir -p "$ROOT/plugins"
            cp server.jar "$ROOT/server.jar"
            cp runtime-inputs/core.jar "$ROOT/plugins/Slimefun.jar"
            cp "runtime-inputs/$KIND.jar" "$ROOT/plugins/MagicExpansion.jar"
            cp runtime-inputs/probe.jar "$ROOT/plugins/ShopRuntimeProbe.jar"
            printf 'eula=true\n' > "$ROOT/eula.txt"
            printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\npause-when-empty-seconds=-1\n' > "$ROOT/server.properties"
            IS_ORIGINAL=false; MARKER=SHOP_RUNTIME_PRESERVATION_PASS; COUNT=7
            if [[ "$KIND" == original ]]; then IS_ORIGINAL=true; MARKER=SHOP_ORIGINAL_DEFECTS_REPRODUCED; COUNT=3; fi
            STATUS=0
            (cd "$ROOT" && timeout --kill-after=20s 240s java -Xms512M -Xmx2G -Dshop.audit.original="$IS_ORIGINAL" -jar server.jar --nogui > server.log 2>&1) || STATUS=$?
            mkdir -p "evidence/$KIND"
            cp "$ROOT/server.log" "evidence/$KIND/"
            if [[ -f "$ROOT/shop-result.txt" ]]; then cp "$ROOT/shop-result.txt" "evidence/$KIND/"; fi
            if [[ -d "$ROOT/plugins/magicexpansion/portable_shops" ]]; then cp -r "$ROOT/plugins/magicexpansion/portable_shops" "evidence/$KIND/"; fi
            if [[ "$STATUS" != 0 ]] || [[ ! -f "$ROOT/shop-result.txt" ]]; then tail -n 100 "$ROOT/server.log"; exit 1; fi
            cat "$ROOT/shop-result.txt"
            grep -Fxq "$MARKER" "$ROOT/shop-result.txt"
            test "$(wc -l < "$ROOT/shop-result.txt")" -eq "$((COUNT+1))"
            if grep -Eq 'SHOP_RUNTIME_FAIL|Error occurred while enabling|NoSuchMethodError|NoClassDefFoundError|SQLITE_CONSTRAINT|InvalidConfigurationException|UnknownDependencyException' "$ROOT/server.log"; then tail -n 100 "$ROOT/server.log"; exit 1; fi
          done
          printf 'PASS: 3 original defects reproduced; 7 corrected cases passed on %s build%s\n' "$MINECRAFT" "$BUILD" > evidence/runtime-result.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shop-handler-runtime-${{ matrix.minecraft }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

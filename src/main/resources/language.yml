      Name: Between Water and Clouds - Fine Rain · Slanting Wind
      Lore:
      - A high-tier Water Cloud rod refined with a Snow-Soul Pearl.
      - Draws rarer Generation 2 fish from rain and mist.
    REED_TASSEL:
      Name: Reed Tassel

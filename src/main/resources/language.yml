    VOID_TOUCH:
      Name: Void Touch
      Lore:
      - Sneak-right-click a block to bind it.
      - Right-click to interact with the bound Slimefun machine.
      - Works within the same world and the configured range.
      - Does not load chunks or bypass protection.
    VOID_TOUCH_SCRIPT:
      Name: Void Touch - Script Edition
      Lore:
      - Sneak-right-click a block to bind it.
      - Right-click to interact with the bound Slimefun machine.
      - Intended for use in action sequences.
      - Works within the same world; does not load chunks.
    FIVE_ELEMENT_TOUCH:
      Name: Five-Element Touch
      Lore:
      - Sneak-right-click a block to bind it.
      - Right-click to open the bound Slimefun machine.
      - Works across dimensions without a distance limit.
      - Does not load the destination chunk.
    FIVE_ELEMENT_TOUCH_RIGHT_CLICK:
      Name: Five-Element Touch - Block Interaction
      Lore:
      - Sneak-right-click a block to bind it.
      - Right-click to simulate a left-click at the bound location.
      - Works across dimensions without a distance limit.
      - Does not load the destination chunk.
    RIGHT_CLICK_MAN:
      Name: Interaction Robot
      Lore:
      - Simulates player interaction with blocks.
      - Useful for automating multiblock machines.
      - Requires a nearby player but no electricity.
      - Does not open vanilla containers.
    DEATH_LIFE_BOOK:
      Name: Book of Life and Death
      Lore:
      - Inspect nearby creatures and their health, names, and locations.
      - Pass judgment or teleport to the selected creature.
    DRAW_MACHINE:
      Name: Prize Draw Machine
      Lore:
      - Configure prizes in the available slots.
      - Each occupied prize slot has an equal chance of selection.
      - Supports consecutive draws.
      - An experimental prize machine.
    MAGIC_WAND:
      Name: Magic Wand
      Lore:
      - Right-click an altar's dispenser to begin crafting.
      - Requires the correct altar layout and ingredients.
    UPDATE_LOG_2025_06_23:
      Name: Update Notes - 2025-06-23
      Lore:
      - Historical upstream update.
      - Added magical soil conversion and automated fishing.
      - Improved prefab placement protection.
    UPDATE_LOG_2025_06_29:
      Name: Update Notes - 2025-06-29
      Lore:
      - Historical upstream update.
      - Added Star Rail collectibles, mystery boxes, and the Starlight Scanner.
    UPDATE_LOG_2025_07_12:
      Name: Update Notes - 2025-07-12
      Lore:
      - Historical upstream update.
      - Improved compatibility for older RSC magic machines.
      - Fixed targeted magic resource mining.

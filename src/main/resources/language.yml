      - An awakened wooden core infused with Stellar Iron dust.
      - Rare aquatic creatures answer its starlit resonance.
    FISHING_ROD_WIND_SPEAKER:
      Name: Windwhisper Rod
      Lore:
      - Carved from ancient, wind-worn spruce.
      - Its line carries the whisper of a wind spirit's wings.
      - The patient angler learns to hear the path of the shoals.

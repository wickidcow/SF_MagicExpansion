    WHEAT_COPPER:
      Name: "赤锈铜麦(Red-Rust Copper Wheat)"
      Lore:
        - '一种麦穗呈现红褐色且能自发产生电流的变异谷物。'
        - ''
        - '特性：'
        - '- 成熟后麦芒尖锐如针，能引导雷电魔力'

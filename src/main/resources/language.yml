    FISH_LURE_BETWEEN_WATER_CLOUD_XINGHE:
      Name: '星核'
      Lore:
        - '拾天外一颗坠星，沉入万丈深渊'
        - '幽光自核而起，炽如初阳'
        - '莫伸手触它，灼灼不可近'

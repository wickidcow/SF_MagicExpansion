    QUICK_MACHINE_BV_INFO:
      Name: '快捷机器[放置版]使用说明'
      Lore:
        - '支持几乎所有的配方'
        - '对原版配方进行了合理化修改'
        - '修改后的配方将作为机器彩蛋呈现'
        - '为了尽可能的降低资源损耗'
        - '并且做好动态刷新'
        - '目前暂不支持shift移入物品来刷新产物列表'

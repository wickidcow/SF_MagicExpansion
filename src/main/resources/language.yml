    WHEAT_SEEDS:
      Name: "糖心麦种(Sugar-Heart Wheat Seeds)"
      Lore:
        - '一种对生长环境极其敏感的变异作物。'
        - ''
        - '特性：'
        - '- 成熟后产量远超普通小麦'
        - '- 在麦芒末梢会凝聚出少量魔法糖'
        - '- 依赖下方耕地的完整性'
        - ''
        - '警告：'
        - '一旦下方泥土变为空气，或遭遇水流冲击'
        - '作物将立即枯萎并失去所有魔法属性'
        - '变为普通作物种子'
        - ''
        - '请确保种植在稳固的耕地上。'


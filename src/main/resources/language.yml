      Lore:
        - ''
    FISHING_GUIDE_BETWEEN_WATER_CLOUD:
      Name: '水云间新钓鱼体系'
      Lore:
        - ''
        - '水云间新钓鱼体系使用方法:'
        - '1. 抛竿入水,浮标静候 —— 依次经历 静默/轻咬/完全咬钩'
        - '2. 完全咬钩后浮标剧烈晃动, 进入蓄力阶段'
        - '3. 转动视角让动作栏标尺的色块对准中央, 持续蓄力'
        - '4. 蓄力满自动收竿必中鱼; 手动收竿时蓄力越高中鱼率越高'
        - '5. 鱼饵放入云梦袋可自动消耗; 熟练度随钓获成长, 等级解锁额外加成'
    BAMBOO_JOINT:
      Name: '青竹节'
      Lore:
        - ''
        - '取溪畔青竹，截节成材'
        - '每一节都封存着一缕山间清风'
    REED_TASSEL:
      Name: '芦穗'
      Lore:
        - ''
        - '蒹葭苍苍，白露为霜'
        - '所谓伊人，在水一方'
        - '风过水云，穗影婆娑'
        - '此穗入水，可作芦花钓之竿材'
    MAGIC_THREAD:
      Name: '魔法线'
      Lore:
        - ''
        - '以魔法糖纺成的丝线'
        - '坚韧轻盈，能牵引水云间的灵物'


    FISHING_ROD_LOG:
      Name: '原木鱼杆'
      Lore:
        - ' '
        - '可以从河里钓起各种原木'
        - '使用方法：使用此鱼杆钓水'
        - '不消耗任何鱼饵'


    FISHING_ROD_NEW_PLAYER:
      Name: '萌新鱼杆'
      Lore:
        - ' '
        - '用河边最柔韧的柳枝和蜘蛛丝缠成'
        - '轻巧顺手，是开始钓鱼的好伙伴'
        - ''
        - '抛出第一竿时'
        - '水面荡开的涟漪，就像在说：欢迎来到这里'
        - ''
        - '「别担心钓不到鱼'
        - '   重要的是，你已经坐在水边了。」'

    FISHING_ROD_BETWEEN_WATER_CLOUD_CYAN_BAMBOO:
      Name: '水云间·青竹竿'
      Lore:
        - ' '
        - '溪畔取翠竹，云端系轻云'
        - '竿握清风，线点秋水'
        - ''
        - '「不必在意鱼篓是否满载'
        - '   坐在水云之间，你已是画中人。」'

    FISHING_ROD_BETWEEN_WATER_CLOUD_REED:
      Name: '水云间·芦花钓'
      Lore:
        - ' '
        - '取溪滩一束芦荻，絮白如初雪'
        - '竿头系轻絮，风来便是钩'
        - ''
        - '「不惊池鱼，只惊一湾芦花'
        - '   芦花落尽时，人比秋水闲」'
        - ''

    FISHING_STICK_STAR_IRON:
      Name: '星辰木'
      Lore:
        - ''
        - '微光在纹理间缓缓流动'
        - '仿佛整片银河被封存在一节枝干之中'
        - ''
        - '经「星坠仪式」注入星辰铁微尘的活化木心'
        - '其共振频率与稀有水生生物的感知波段完全契合'
        - ''
        - '在木棒中，星辰铁微尘闪烁着耀眼的蓝光'
        - '「有些鱼，只回应星光的低语。」'

    FISHING_ROD_WIND_SPEAKER:
      Name: '风语者之竿'
      Lore:
        - ' '
        - '竿身由千年风蚀的云杉木雕琢而成'
        - '线轮缠绕着风灵羽翼间凝结的气流之丝'
        - ''
        - '持之静立，耳畔似有风吟低语'
        - '抛竿如引雷，收线若驭风'
        - ''
        - '传说唯有真正理解“等待”的人'
        - '才能听见风告诉他的鱼群轨迹'
        - ''
        - '「风从不指引方向'
        - '   它只是拂过那些已准备好出发的人。」'

    南柯一梦终须醒_浮生若梦皆是空:
      Name: '纠缠之节：终焉之丝·悖论为钩'
      Lore:
        - ' '
        - '一截来自平行宇宙交界处的甘蔗'
        - '其节节皆处于量子纠缠态'
        - '一动，则万界同步'
        - ''
        - '鱼线由“终焉之丝”纺成'
        - '它不连向深海，而连向时间的尽头'
        - ''
        - '鱼钩名为“悖论”'
        - '因它能钓起“从未存在”之物'
        - ''
        - '当竿尖轻颤——'
        - '无数现实中的“已钓起”瞬间'
        - '同时发生。'
        - ''
        - '「你问它为何无所不钓？」'
        - '「因为它钓的，是“钓起”本身。」'

    FISHING_ROD_FINAL_STRING:
      Name: '终焉之丝'
      Lore:
        - ' '
        - '并非丝线，而是时间尽头'
        - '断裂的一缕因果残响'
        - ''
        - '它不连向深海，也不连向星空'
        - '而是垂入“终结之后”的寂静'
        - ''
        - '当竿尖轻颤，万界终末的回音'
        - '便顺着丝线，逆流而上'
        - ''
        - '于是——'
        - '未死之物显露终局'
        - '未生之物预见归宿'
        - ''
        - '「它不钓鱼」'
        - '「它钓的是万物注定沉没的倒影。」'
    FISHING_ROD_FINAL_HOOK:
      Name: '悖论鱼钩'
      Lore:
        - ' '
        - '此钩从未被铸造'
        - '因为它存在于“被铸造之前”'
        - ''
        - '它同时是：'
        - '  ——已锈蚀的终末之钩'
        - '  ——尚未诞生的初生之尖'
        - ''
        - '观测它的人，会看见自己'
        - '正在抛竿的未来'
        - '与已被钓起的过去'
        - '同时发生'
        - ''
        - '「它不违反规则」'
        - '「它只是证明：规则，不自洽。」'


    FISHING_ROD_FISH_ANYTHING:
      Name: '鱼获：任何物品'
      Lore:
        - ' '
        - '该物品仅供参考'
        - '没有实际作用'

    DOUBLE_SIDED_TAPE:
      Name: '双面胶'
      Lore:
        - ''
        - '可以将物品贴到方块上面'
        - '- 消耗品'

    SCHRODINGER_FRAME_ONE:
      Name: '薛定谔的相框[显性]'
      Lore:
        - ''
        - '相框上的物品真的存在吗？'
        - '将物品放置上去'
        - '目前仅支持没有NBT的原版物品'
        - '有50%的概率消失'
        - '有50%的概率双倍掉落'
        - '打破相框后'
        - '可能会掉落双倍物品'
        - '也可能什么也不会掉落'
        - '一次性消耗品'



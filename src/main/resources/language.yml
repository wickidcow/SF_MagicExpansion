          - '介绍了各种鱼的喜好'
          - '以及某些特殊鱼获的方式'

    MAGIC_CROP_INFO:
      Name: "魔法作物信息"
      Lore:
        - ' '
        - '请确认你是否安装了SlimeGlue(粘液胶)'
        - '他可以保证你的魔法作物在重启后数据不丢失'
        - '若未安装，服务器重启后将丢失魔法作物的粘液数据'

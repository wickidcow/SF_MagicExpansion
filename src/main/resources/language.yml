    ENCHANTING_TABLE:
      Name: Magic Empowerment Table
      Lore:
      - Apply magical attributes independently of enchantments.
      - Consumes empowerment materials and electricity.
      - 'Energy: 10,000 J per operation.'
      - 'Capacity: 8,888,888 J.'
    BASIC_ENCHANT_STONE:
      Name: Stellar Iron
      Lore:
      - A rare metal refined from fallen meteorites.
      - Its power comes from beyond the mortal world.
    WIND_SPIRIT:
      Name: Breath of the Wind Spirit
      Lore:
      - The last pure breath of a fading wind spirit.
      - A whisper of storms, freedom, and distant mountain skies.
      - A catalyst for magic of flight, speed, and wind.
    WIND_SPIRIT_DROP:
      Name: Wind Spirit Drops
      Lore:
      - Defeat the Wind Spirit for a chance to obtain its breath.
      - 'Drop chance: 91.888%.'
    BASIC_ENCHANT_STONE_DROP:
      Name: Flame Zombie Drops
      Lore:
      - Defeat a Flame Zombie for a chance to obtain Stellar Iron.
      - 'Drop chance: 91.888%.'
      - An ancient curse has fused meteoric metal into its body.
    ENCHANTING_TABLE_INFO:
      Name: Empowerment Guide
      Lore:
      - Place a weapon and empowerment material in their slots.
      - Select the attributes you want to apply.
      - Levels 1-3 consume 1-3 materials respectively.
      - Material quantity determines the number of attributes.
      - Material quality determines their strength.
    ENCHANTING_TABLE_LIST:
      Name: Empowerment Effects
      Lore:
      - Launch, attraction, fire, slowing, and lightning.
      - Creation, ender-pearl arrows, and position swapping.
    FIREZOMBIE_HEAD:
      Name: Flame Zombie Head
      Lore:
      - A vessel of magical fire and ender energy.
      - Its owner wields spells, teleportation, and mental attacks.
    FIREZOMBIE_BODY:
      Name: Flame Zombie Body
      Lore:
      - Decay and rebirth, bound together in living flame.
    WIND_ELF_SPAWN:
      Name: Wind Spirit Summoner
      Lore:
      - Right-click to summon the Wind Spirit.
    WIND_ELF_HEAD:
      Name: Wind Spirit Head
      Lore:
      - A vessel of wind magic and ender energy.
      - Its owner wields twin winds, teleportation, and mental attacks.
    WIND_ELF_BODY:
      Name: Wind Spirit Body
      Lore:
      - A wind spirit's body, condensed from the water element.
    WIND_ELF_SKILL:
      Name: Wind Spirit Abilities
      Lore:
      - Uses a random ability every 4-6 seconds.
      - 'Magic Strike: 10 damage to its target.'
      - 'Twin Winds: two nearby players take 68 and 136 damage.'
      - Both strikes may select the same player; armor still applies.
      - 'Gale: harms and debuffs players within 15 blocks horizontally'
      - and 8 blocks vertically.
    WIND_ELF_DEFENSE:
      Name: Fighting the Wind Spirit
      Lore:
      - Regenerates 2 health per second.
      - Only sword attacks can harm it.
      - Requires 2-5 nearby players to become vulnerable.
      - After casting, its defenses weaken for 2-4 seconds.
      - Each hit is capped at 33% of its maximum health.
      - Moves rapidly and teleports every 2 seconds.
    PRE_BUILDING_TREE_INFO:
      Name: Prefab Placement Guide
      Lore:
      - Right-click a block to place the stored structure.
      - Sneak-right-click to inspect its dimensions and volume.
      - Trees grow from the center of their base.
      - Other structures extend from the origin toward +X, +Y, and +Z.
      - Each prefab has a fixed layout.
    PRE_BUILDING_OAK_TREE:
      Name: Prefab Oak Tree
      Lore:
      - A oak tree sealed within a seed of folded magical space.
      - Release it to bring the life of an ancient forest to your home.
      - Right-click a block to place it.
      - Sneak-right-click to inspect its dimensions.

    COOPERATE_CREATION_INFO:
      Name: Community Creations
      Lore:
      - Content created together with players.
      - Everyone is welcome to contribute a balanced idea.
    FISHING_INFO:
      Name: Magic Fishing Guide
      Lore:
      - Only MagicExpansion rods trigger magic fishing.
      - Bait in the off hand is checked first.
      - Otherwise, earlier registered bait has priority.
      - Rod tier affects catch weight and rarity.
      - The rod and bait together determine the catch pool.
      - Fishing without bait can produce different catches.
      - Special bait can yield the materials for the Windwhisper Rod.
    FISH_CATEGORY_INFO:
      Name: Fish Rarities
      Lore:
      - Fish are grouped as Common, Uncommon, Rare, Epic,
      - Legendary, and Mythic.
      - See each catch pool for its available species.
    RANDOM_FISH_COMMON:
      Name: Common Fish
      Lore:
      - Familiar shoals beneath the river surface.
      - Browse the species in this rarity tier.
    RANDOM_FISH_UNCOMMON:
      Name: Uncommon Fish
      Lore:
      - A less familiar visitor to the waiting hook.
      - Browse the species in this rarity tier.
    RANDOM_FISH_RARE:
      Name: Rare Fish
      Lore:
      - An elusive catch treasured by patient anglers.
      - Browse the species in this rarity tier.
    RANDOM_FISH_RARE_POOL_DUST:
      Name: Rare Dust Fish
      Lore:
      - An elusive catch treasured by patient anglers.
      - Browse fish that produce dust.
    RANDOM_FISH_RARE_POOL_ORE:
      Name: Rare Ore Fish
      Lore:
      - An elusive catch treasured by patient anglers.
      - Browse fish that produce ore.
    RANDOM_FISH_RARE_POOL_INDUSTRY:
      Name: Rare Industry Fish
      Lore:
      - An elusive catch treasured by patient anglers.
      - Browse fish that produce industry.
    RANDOM_FISH_EPIC_POOL_INDUSTRY:
      Name: Epic Industry Fish
      Lore:
      - A remarkable catch few anglers have seen.
      - Browse fish that produce industry.
    RANDOM_FISH_EPIC_POOL_ALLOY_INGOT:
      Name: Epic Alloy Ingot Fish
      Lore:
      - A remarkable catch few anglers have seen.
      - Browse fish that produce alloy ingot.
    RANDOM_FISH_EPIC:
      Name: Epic Fish
      Lore:
      - A remarkable catch few anglers have seen.
      - Browse the species in this rarity tier.
    RANDOM_FISH_LEGENDARY:
      Name: Legendary Fish
      Lore:
      - A creature remembered in ancient fishing tales.
      - Browse the species in this rarity tier.
    FISH_LEGENDARY_EEL_POWER:
      Name: Aether Eel
      Lore:
      - A living carrier for stored electricity.
    FISH_LURE_BASIC:
      Name: Basic Magic Bait
      Lore:
      - Worms and grain steeped in a mild magical solution.
      - Every magical angler's journey begins with a simple cast.
    FISH_LURE_DUST:
      Name: Metal-Dust Bait
      Lore:
      - Metal powders mixed with basic magic bait.
      - Its mineral resonance attracts metal-dust fish.
    FISH_LURE_ORE:
      Name: Mineral Bait
      Lore:
      - Minerals mixed with basic magic bait.
      - Attracts fish that produce gems and other mineral resources.
    FISH_LURE_ALLOY_INGOT:
      Name: Alloy Bait
      Lore:
      - Forged around an ancient alloy's lingering heat.
      - Attracts fish that produce advanced alloy ingots.
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_CUIXIA:
      Name: Between Water and Clouds Special Catch - Tempered Sunset
      Lore:
      - A guide entry for this lure's special catch pool.
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_WEICHEN:
      Name: Between Water and Clouds Special Catch - Motes
      Lore:
      - A guide entry for this lure's special catch pool.
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_RONGHUO:

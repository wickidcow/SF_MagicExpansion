      Name: Dreams Must End
      Lore:
      - A rod fashioned at the boundary between worlds.
      - The Thread of the End bears a hook called Paradox.
      - With special bait, it can draw from a vast pool of Slimefun items.
      - Even the most beautiful dream must eventually end.

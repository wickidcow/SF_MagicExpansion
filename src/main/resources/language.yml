      - Plant on intact farmland and harvest only when mature.
      - Breaking the soil beneath it or washing it away with water
      - can strip its magic and leave an ordinary crop.
    WHEAT_BRONZE_INGOT:
      Name: Bronze Wheat (Ingot)

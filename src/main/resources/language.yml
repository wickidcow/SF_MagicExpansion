      Name: Double-Sided Tape
      Lore:
      - Attach an item to the surface of a block.
      - Consumed on use.
    SCHRODINGER_FRAME_ONE:
      Name: Schrodinger's Frame
      Lore:
      - Accepts only vanilla items without custom data.
      - 50% chance to lose the item; 50% chance to receive two.
      - The frame is consumed after use.
    SCHRODINGER_FRAME_INFINITE:
      Name: Schrodinger's Frame - Reusable
      Lore:
      - Accepts only vanilla items without custom data.
      - 50% chance to lose the item; 50% chance to receive two.
      - Empty the frame before breaking it.
      - Breaking it may drop an ordinary item frame.
    ITEM_NAME_TAG:
      Name: Portable Item Name Tag
      Lore:
      - Sneak-right-click to set the name on this tag.
      - Right-click to apply that name to an item or creature.
      - Consumed when a name is applied.
    FISHING_BOOK:
      Name: Fishing Guide
      Lore:
      - Discover fish preferences, bait pools, and special catches.
    MAGIC_CROP_INFO:
      Name: Magic Crop Guide
      Lore:
      - Plant magical crops on farmland and harvest them when mature.
      - Flowing water can destroy their Slimefun data.
      - Protect the farmland beneath them.
      - Use a compatible crop-persistence setup to retain crop data
      - through server restarts; upstream recommends SlimeGlue.

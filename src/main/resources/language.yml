        - '可以对其进行快速制作'
        - '目前支持的配方：铁矿，金矿，下界岩，筛矿，已粉碎的矿石，纯矿簇，煤'
    QUICK_HEATED_PRESSURE_CHAMBER_BV:
      Name: '魔法压力舱[放置版]'
      Lore:
        - '将材料放入魔法压力舱'
        - '可以直接呈现出可制作的最终产物列表'
        - '可以对其进行快速制作'
    ENCHANTING_TABLE:
      Name: '魔法赋能台'
      Lore:
        - '一套独立的增益属性'
        - '需要消耗强化材料和电力'
        - '⇨ ⚡ 10,000 J/per'
        - '⇨ ⚡ 8,888,888 J 可存储'
    BASIC_ENCHANT_STONE:
      Name: '星辰铁'
      Lore:
        - '星辰铁是一种神秘而稀有的金属'
        - '这种金属并非源自凡间'
        - '而是由坠落于世间的陨石中提炼而出'
    WIND_SPIRIT:
      Name: '风灵之息'
      Lore:
        - '风之精灵消散时留下的最后一缕纯净气息'
        - '它无形无相，却承载着风暴与自由的意志'
        - '触摸时，指尖会掠过一阵微不可察的轻吟'
        - '仿佛远方山巅的呼啸，或云层间的低语'
        - '是激活浮空、迅捷与御风类魔法的核心引信'
        - ''
        - '「真正的风，从不归属于任何人'
        - '   它只是短暂地，借你之手重临世间。」'
    WIND_SPIRIT_DROP:
      Name: '风灵'
      Lore:
        - '击杀风灵时掉落'
        - '概率：91.888%'
        - '风之精灵消散时留下的最后一缕纯净气息'
        - '「真正的风，从不归属于任何人'
        - '   它只是短暂地，借你之手重临世间。」'
    BASIC_ENCHANT_STONE_DROP:
      Name: '烈焰僵尸'
      Lore:
        - '击杀烈焰僵尸时掉落'
        - '概率：91.888%'
        - '不可思议的是'
        - '星辰铁也能从烈焰僵尸——一种罕见的、在燃烧与毁灭中重生的不死生物身上获取'
        - '其主要通过精炼特定陨石获得'
        - '但也有极大概率从烈焰僵尸身上掉落'
        - '这些僵尸似乎因为某种古老的诅咒'
        - '体内融合了微量的星辰铁'
    ENCHANTING_TABLE_INFO:
      Name: '魔法赋能说明'
      Lore:
        - '你需要有星辰铁之类的材料'
        - '并且将武器放入对应的槽位'
        - '将赋能材料放到对应的槽位'
        - '手动选择你想要的增益属性'
        - '有1-3级的区分'
        - '1-3级分别会消耗1-3个材料'
        - '最后出现的强化属性数量也会不同'
        - '材料数量决定强化属性数量'
        - '材料品质决定强化属性品质'
    ENCHANTING_TABLE_LIST:
      Name: '魔法赋能列表'
      Lore:
        - '击飞'
        - '吸引'
        - '火焰'
        - '减速'
        - '雷击'
        - '创生之力'
        - '末影珍珠箭矢'
        - '攻击换位'
        - '敬请期待'
    FIREZOMBIE_HEAD:
      Name: '烈焰僵尸头颅'
      Lore:
        - '蕴含着丰富的魔法元素'
        - '蕴含着丰富的末影元素'
        - '他能够施展魔法攻击'
        - '还能够施展末影瞬移'
        - '会使用精神类攻击'
        - '还会使用本命火元素攻击'
    FIREZOMBIE_BODY:
      Name: '僵尸BOSS躯干'
      Lore:
        - '是腐朽也是新生'

    WIND_ELF_SPAWN:
      Name: '风灵'
      Lore:
        - ' '
        - '右键召唤风灵'

    WIND_ELF_HEAD:
      Name: '风灵头颅'
      Lore:
        - '蕴含着丰富的魔法元素'
        - '蕴含着丰富的末影元素'
        - '他能够施展双子风攻击'
        - '还能够施展末影瞬移'
        - '会使用精神类攻击'
        - '还会使用本命风元素攻击'
    WIND_ELF_BODY:
      Name: '风灵躯干'
      Lore:
        - '水元素凝聚的风灵躯干'

    WIND_ELF_SKILL:
      Name: '风灵技能介绍'
      Lore:
        - '技能使用：4-6秒随机释放一个技能'
        - '1：魔法攻击'
        - '对目标造成10点魔法伤害'
        - '特殊提示：不无视护甲'
        - '2：乂爻风'
        - '随机选取周围2个玩家并对其分别造成68，136点伤害'
        - '特殊提示：不无视护甲，并且可能锁定同一个玩家'
        - '3：絮风攻击'
        - '对水平范围15格内，垂直范围8格内的玩家造成群体伤害'
        - '并给予群体负面效果'
    WIND_ELF_DEFENSE:
      Name: '风灵防御介绍'
      Lore:
        - '回血：每秒恢复2点生命值'
        - ''
        - '风灵惧怕剑类武器'
        - '风灵对其他武器的攻击有着100%的免伤'
        - ''
        - '周围需要一定的阳气来压制风灵'
        - '需要2~5人才能对风灵造成伤害'
        - ''
        - '风灵在每次使用技能后，会有2~4秒的虚弱期'
        - '此时风灵的免伤将会大幅降低，风灵每次受到的伤害不会超过33%'
        - ''
        - '风灵有极快的移动速度'
        - '每2秒会发动一次快速移动'


    PRE_BUILDING_TREE_INFO:
      Name: '预制菜·信息'
      Lore:
        - '可以把他当成一个道具'
        - '也可以当成一个生成器'
        - '每棵树的数据都是固定的'
        - '只有树是从中心下方生成'
        - '其他建筑都是从相对零点(0,0,0)生成到(+x,+y,+z)'
        - '右键放置预制建筑'
        - 'shift+右键查看建筑占地信息'
    PRE_BUILDING_OAK_TREE:
      Name: '预制树·橡木树'
      Lore:
        - '这是一颗封印于魔法空间中的橡木树种子，蕴含着古老森林的生命之力'
        - '一旦释放，它将迅速成长为一棵壮观的橡木树'
        - '为你周围的环境带来勃勃生机'
        - '手持这枚神奇的种子，找到你心仪的地点，对准任意方块右键点击'
        - '瞬间，你会看到土地上破土而出一株嫩绿的新芽'
        - '并以惊人的速度成长为一棵枝繁叶茂的橡木树'
        - '无论是装饰你的建筑还是扩展你的家园'
        - '只需轻轻一点，即可省去种植与等待成长的时间'

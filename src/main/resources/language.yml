      - A spark of sunset tempered beside the forge.
      - Draws alloy, metal, and crafted treasures from the water.
    FISH_LURE_BETWEEN_WATER_CLOUD_WEICHEN:
      Name: Motes
      Lore:
      - Fine mineral dust gathered beside the stream.
      - Draws ores, dusts, and raw materials from the water.

        - '无论是装饰你的建筑还是扩展你的家园'
        - '只需轻轻一点，即可省去种植与等待成长的时间'
    PRE_BUILDING_TAFEI:
      Name: '预制雕像·糖厂塔菲'
      Lore:
        - '这是一座封印于魔法空间中的糖厂塔菲建筑'
        - '选择一处桃源，将他放置下来'
        - '糖厂塔菲在这里生产糖'
        - '塔菲永远朝向日落的地方'
    PRE_BUILDING_WISH_DALE:
      Name: '预制雕像·维什戴尔'
      Lore:
        - '雕像表面残留着硝烟与火药的气息，仿佛刚从一场爆炸中被抢救出来。'
        - '她单膝立于碎石之上，肩炮微扬，嘴角挂着那抹标志性的、令人不安的笑。'
        - '据说只要靠近三米，就能听见她低语：“嘿，想不想看烟花？”'
        - '将雕像安放于战场边缘或基地高处——'
        - '也许她不会守护你，但敌人一定会记得，这里有人“不好惹”。'
    PRE_BUILDING_ANON:
      Name: '预制雕像·千早爱音'
      Lore:
        - '雕像表面泛着微弱的粉蓝色光晕，仿佛有电流在发丝与裙摆间悄然流动。'
        - '她踮脚跃起，吉他斜挎身后，双眸望向远方，像是下一秒就要奔向舞台的聚光灯。'
        - '若在夜深人静时靠近，隐约能听见一段未完成的旋律在风中轻轻回响。'
        - '将她安放在生活区或瞭望台旁——'
        - '也许不会驱散黑暗，但至少，有人记得：这里也曾有人，为梦想高歌。'

    PRE_BUILDING_VILLAGE_LOVE_AND_TRADE_HOUSE:
      Name: '预制生电·村民-爱与交易所'
      Lore:
        - '这是一座封印于魔法空间中的村民-爱与交易所建筑'
        - '选择一处桃源，将他放置下来'
        - '村民繁殖与交易一体化场所'
        - '采用船吸固定村民'
        - '请自助在需要的点位放置船只'
        - '左下角为村民繁殖场所'
        - '中间与右边为两处村民交易聚集地'
        - '周围配备了完善的铁路设施运输村民'
    PRE_BUILDING_SHULKER_FARM:
      Name: '预制生电·潜影贝农场'
      Lore:
        - '这是一座封印于魔法空间中的潜影贝农场'
        - '选择一处空旷的地方，将他放置下来'
        - '潜影贝在这里分裂出大量潜影贝'
        - '请自助吸引潜影贝'
        - '请自助放置雪傀儡'
        - '中心为农场'
        - '下方为收集装置'

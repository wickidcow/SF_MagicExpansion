        - '并且只会有概率掉落普通相框'


    ITEM_NAME_TAG:
      Name: '便携式命名牌'
      Lore:
        - ''
        - 'shift+右键 修改便携式物品命名牌名称'
        - '右键 消耗便携式物品命名牌'
        - '将物品命名牌的名字刻在物品上'

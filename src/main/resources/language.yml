        - '便会挣脱岩层的束缚，循声而来'
        - ''
        - '是引诱「高阶合金鱼种」的至臻诱饵'
        - '——铁锭、金锭、下界合金，乃至失落文明的星陨钢之化身'


    ##新系列鱼饵相关  水云间
    FISH_LURE_BETWEEN_WATER_CLOUD_CUIXIA:
      Name: '淬霞'
      Lore:
        - '取炉边一簇晚霞，淬尽凡铁成钢'
        - '锤声起落，万金归一'
        - '火花溅开时，仿若"点石成金"'
        - '莫问熔炼几何，此物生而含光'
    FISH_LURE_BETWEEN_WATER_CLOUD_WEICHEN:
      Name: '微尘'
      Lore:
        - '掬溪畔一捧细沙，指间微尘如烟'
        - '风起尘扬，落地成矿'
        - '莫嫌此物轻若鸿毛'
        - '万尘聚起，便是整座青山'
    FISH_LURE_BETWEEN_WATER_CLOUD_RONGHUO:
      Name: '熔火'
      Lore:
        - '取炉心一团熔火，浇尽顽石成锭'
        - '火舌过处，土石化铁'
        - '莫问温度几何，灼灼即是本相'
        - '一锭出炉，万器可成'
    FISH_LURE_BETWEEN_WATER_CLOUD_YUEJIN:
      Name: '跃金'
      Lore:
        - '收满江一片浮光，金波跃于水面'
        - '月落潮生，静影沉璧'
        - '收竿刹那，仿若"满载而归" '

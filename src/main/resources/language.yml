en_US:
  Items:
    QUICK_MACHINE_BV_INFO:
      Name: Quick Machine Guide
      Lore:
      - Insert ingredients to see the recipes you can craft.
      - Supports most recipes, with some adjusted vanilla recipes.
      - Shift-clicking ingredients in does not refresh the results.
      - Click an input item or the Nether Star to refresh.
      - Removing ingredients with Shift-click also refreshes the list.

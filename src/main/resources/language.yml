      - Harvest mature plants for bronze ingots.
      - Plant on intact farmland and harvest only when mature.
      - Breaking the soil beneath it or washing it away with water
      - can strip its magic and leave an ordinary crop.
    BEET_BRASS_INGOT:
      Name: Brass Beet (Ingot)
      Lore:
      - Copper and zinc unite in golden alloy grain.
      - Harvest mature plants for brass ingots.
      - Plant on intact farmland and harvest only when mature.
      - Breaking the soil beneath it or washing it away with water
      - can strip its magic and leave an ordinary crop.
    ENCHANTMENT_ERASER:
      Name: Empowerment Eraser
      Lore:
      - Hold this in your main hand and the target item in your off hand.
      - Right-click to remove its Magic Empowerment attributes.
      - This cannot be undone.
    FISH_WEIGHT_ENHANCER:
      Name: Magic Fish Growth Feed
      Lore:
      - Hold feed in your main hand and a magic fish in your off hand.
      - Right-click to increase the fish's weight.
      - Crossing weight thresholds can improve its production stats.
      - Feed is not fishing bait.
    RESEARCH_UNLOCKER_PAPER:
      Name: Lost Page of Revelation
      Lore:
      - A weathered page containing fragments of forgotten knowledge.
      - Hold in your main hand and right-click
      - to unlock a random research you have not yet learned.
    WORD_CLEAR:
      Name: Hologram Eraser
      Lore:
      - Hold in your main hand and right-click near a hologram.
      - Selects the nearest holographic armor stand within 3 blocks.
      - Right-click again to confirm its permanent removal.
    PORTABLE_SHOP:
      Name: Portable Market
      Lore:
      - Right-click to browse the market.
      - Administrators can sneak-right-click to configure trades.
    FARM_HARVEST_BREAD:
      Name: Harvest Blessing Bread
      Lore:
      - Bread baked with sunlight and the blessing of the harvest.
      - Eat to restore 8 health (4 hearts).
      - Grants Saturation III for 15 seconds and Regeneration I for 8 seconds.
      - 20% chance to drop Sweetheart Wheat Seeds.
    HOLY_PIE:
      Name: Holy Pie
      Lore:
      - Pumpkin and refined flour beneath ancient protective runes.
      - Eat to restore 12 health (6 hearts).
      - Grants Divine Protection for 1.5 seconds.
      - Removes harmful potion effects.
    CLOUD_BREAD:
      Name: Cloud Bread
      Lore:
      - A light loaf carrying the breath of the morning sky.
      - Eat to restore 8 health (4 hearts).
      - Grants Jump Boost III and Slow Falling for 15 seconds.
      - Stops a rapid downward fall when consumed.
    HARVEST_WHEAT:
      Name: Harvest Wheat
      Lore:
      - Golden grain carrying the blessing of the harvest.
      - An ingredient for magical bread and ceremonial pastries.
      - Crafting ingredient; cannot be eaten directly.
    WHEAT_FLOUR:
      Name: Refined Wheat Flour
      Lore:
      - Finely milled harvest wheat, white as fresh snow.
      - Used in Cloud Bread, Holy Pie, and other magical foods.
      - Crafting ingredient; cannot be eaten directly.
    HARVEST_RICE:
      Name: Harvest Rice
      Lore:
      - Heavy grains nourished by morning dew and clear springs.
      - The quiet promise of a plentiful harvest.
      - Crafting ingredient; cannot be eaten directly.
    DREAM_KERNEL:
      Name: Dream Kernel
      Lore:
      - A tribute to Yuan Longping and his dream of abundant harvests.
      - Within this seed lives the hope of shelter beneath tall rice
      - and a world where no one goes hungry.
    PRESS_CORE_ALPHA:
      Name: Press Core Alpha
      Lore:
      - Once a consumer-grade component.
      - Magical alterations have given it an industrial purpose.
    ENERGY_CONNECTOR_GLASS:
      Name: Glass Energy Connector
      Lore:
      - Connects nearby generators and machines to an energy network.
      - 'Connection range: 6 blocks.'
    ENERGY_CONNECTOR_GLASS_INFO:
      Name: Glass Energy Connector Guide
      Lore:
      - Connects nearby generators and machines to an energy network.
      - 'Connection range: 6 blocks.'
      - Craft with any vanilla glass block or glass pane.
    WEAPON_STAR_SHARDS_SWORD:
      Name: Starfall Judgment
      Lore:
      - A legendary blade of arcane power and celestial fire.
      - 'Attack: Blazing Slash. Sneak-attack: Arcane Blast.'
      - 'Right-click: Astral Shield, which reflects projectiles.'
      - 'Sneak-right-click: Blink to the targeted ground.'
      - Bleeding stacks independently and cannot deliver a killing blow.
      - Damage and cooldowns follow the server configuration.
    SF_TIMINGS_HOLOGRAM:
      Name: Slimefun Tick Monitor
      Lore:
      - Displays total Slimefun tick time and the current chunk's time.
      - Use it to locate demanding machine setups.
    MUSIC_TEST:
      Name: Music Test
      Lore:
      - A few bright notes from an experimental instrument.
    CARGO_FRAGMENT:
      Name: Aether Cargo Chest
      Lore:
      - Holds items recovered from a broken Magic Storage Terminal.
      - Place it in compatible storage to restore its contents.
      - Each chest holds up to 2,147,483,647 items.
    CARGO_TERMINAL:
      Name: Magic Storage Terminal
      Lore:
      - Stores up to 1,145 item types.
      - Supports Slimefun cargo and wireless transfer across dimensions.
      - 'Remote output: up to 256 items; input: up to 512 items per cycle.'
      - Can output to vanilla containers, but cannot extract from them.
      - Breaking the terminal releases its contents as Aether Cargo Chests.
      - At most 2,048 chests can be dropped for each item type.
    CARGO_TERMINAL_RENEW:
      Name: Magic Storage Terminal - Reforged
      Lore:
      - Stores up to 1,145 item types with adjustable quantity limits.
      - Supports Slimefun cargo and wireless transfer across dimensions.
      - 'Remote output: up to 256 items; input: up to 512 items per cycle.'
      - Transfers between Slimefun machines and containers only.
      - 'Warning: lowering a limit below the stored amount deletes the excess.'
    CHINESE_CHARACTER_CONSTRUCTOR:
      Name: Character Engraving Workshop
      Lore:
      - A miniature workshop for traditional carved characters.
      - Produces character components for compatible ID-card recipes.
    SEND_ITEMS_TO_PLAYER_MACHINE:
      Name: Aether Cargo Sender
      Lore:
      - Transfers an Aether Cargo Chest's contents to a selected player.
      - Insert individual cargo chests; stacked chests stop the machine.
      - Place this machine again after each server restart.
    SEND_ITEMS_TO_PLAYER_MACHINE_SF:
      Name: Aether Cargo Sender - Slimefun Tick
      Lore:
      - Transfers an Aether Cargo Chest's contents to a selected player.
      - Insert individual cargo chests; stacked chests stop the machine.
      - Runs once per Slimefun tick.
    PORTABLE_CARGO_TRANSPORTER:
      Name: Portable Aether Cargo Extractor
      Lore:
      - Transfers an Aether Cargo Chest's contents to your inventory.
    CUSTOM_SEQUENCE_TOOL:
      Name: Action Sequence Tool
      Lore:
      - Stores a sequence of player actions in the item.
      - Supports teleportation, interaction, delays, commands, and messages.
    TWO_TO_MAGIC_GEO_MACHINE_FORCE:
      Name: Forced Magic Resource Converter
      Lore:
      - Converts intermediary magic resources into their target resources.
      - Without the matching magic integration, the result is stone.
      - 'Energy: 52 J/s. Capacity: 1,314 J.'
    WORLD_CORE:
      Name: World Core
      Lore:
      - Its purpose remains a mystery.
    ITEM_ORIGIN_BACK_TRACK:
      Name: Material Origin Tracer
      Lore:
      - Uses immense power to reproduce an item's recipe ingredients.
      - Insert a Slimefun item; the source item is not consumed.
      - Only ingredients displayed in the Slimefun guide can be produced.
      - 'Cycle: 5 seconds.'
      - 'Energy: 2,147,483,646 J/tick. Capacity: 2,147,483,647 J.'
    NEW_YEARS_DAY_FIREWORK_YUAN_DAN:
      Name: 2026 New Year Firework - Starlight
      Lore:
      - A ring of stars opens the gates of a new year.
      - A commemorative firework for December 31, 2025.
      - May its light guide you toward new wonders.
    NEW_YEARS_DAY_FIREWORK_YUAN_DAN_2:
      Name: 2026 New Year Firework - Celebration
      Lore:
      - A spinning burst of festive light crosses the midnight sky.
      - A commemorative firework welcoming 2026.
      - May hope rise with every spark.

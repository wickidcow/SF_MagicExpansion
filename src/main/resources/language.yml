      Name: "高纤土豆(High-Fiber Potato)"
      Lore:
        - '一种根系极度发达且富含魔力的变异块茎。'
        - ''
        - '特性：'
        - '- 成熟后产量远超普通土豆'
        - '- 块茎内部交织着高浓度的魔力纤维'
        - '- 依赖下方耕地的完整性'
        - ''
        - '警告：'
        - '一旦下方泥土变为空气，或遭遇水流冲刷'
        - '根系将瞬间断裂并失去所有魔力活性'
        - '退化为普通土豆种子'
        - ''
        - '请确保种植在稳固的耕地上。'

    HYBRID_RICE_SEEDS:
      Name: "杂交水稻种子 (Hybrid Rice)"
      Lore:
        - ' '
        - '“我做过一个梦，梦中我和大家一起'
        - ' 在稻田里散步，在水稻下面乘凉。”'
        - '“那个梦真是太美了...”'
        - '—— 袁隆平'
        - ' '
        - '✨ 这是承载着“禾下乘凉梦”的神奇种子。'
        - ' '
        - '特性：'
        - '• 极高产量：成熟后收获大量稻谷'
        - '• 巨型植株：成熟后稻穗高大，可遮挡阳光'
        - '• 坚韧根系：需要种植在湿润的耕地上'
        - ' '
        - '⚠ 注意：'
        - '若耕地被破坏或遭遇洪水冲刷，'
        - '它将突变为普通的小麦种子。'
        - ' '
        - '右键种植在湿润的耕地上'


    ORE_DUST_CRYSTAL:
      Name: "✨ 矿粉结晶 (Ore Dust Crystal)"
      Lore:
        - '一种在采集成熟魔法矿粉农作物时，低概率掉落的稀有副产物。'

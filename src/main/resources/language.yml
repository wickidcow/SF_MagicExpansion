      Name: Thread of the End
      Lore:
      - A broken echo of cause and effect from the end of time.
      - It reaches beyond the sea into the silence after all things.
    FISHING_ROD_FINAL_HOOK:
      Name: Paradox Hook
      Lore:
      - A hook that exists before its own forging.
      - The final rusted point and the first unmade edge are one.
    FISHING_ROD_FISH_ANYTHING:
      Name: Catch Anything - Reference
      Lore:
      - A guide reference for the final rod's special catch pool.
      - This display item has no function of its own.

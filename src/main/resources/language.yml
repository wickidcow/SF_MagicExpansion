    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_NINGSHUANG:
      Name: Frostfall
      Lore:
      - A Snowy River lure attuned to forming frost.
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_LUOXU:
      Name: Falling Flakes
      Lore:
      - A Snowy River lure light enough to drift on cold water.
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_BINGPO:
      Name: Ice Soul
      Lore:
      - A Snowy River lure carrying deep frozen energy.
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_CHUJI:
      Name: First Clearing
      Lore:
      - A Snowy River lure warmed by the first light after snow.
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_CHUILUN:
      Name: Lone Line
      Lore:
      - A Snowy River lure for quiet, patient fishing.
      - A lone line rests beneath mountains wrapped in evening snow.
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_FENGSI:
      Name: Wind Thread
      Lore:
      - A Fine Rain lure carried by thin strands of wind.
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_YANYU:
      Name: Mist Rain
      Lore:
      - A Fine Rain lure for fog-covered waters.
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_LIANBAI:
      Name: White Ripple
      Lore:
      - A Fine Rain lure that leaves a pale ripple on the surface.
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_XIAOFENG:
      Name: Dawn Wind
      Lore:
      - A Fine Rain lure for the first breeze of morning.
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_XIEYING:
      Name: Slanting Shadow
      Lore:
      - A Fine Rain lure made for broken reflections and hidden currents.
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_BAILUYU:
      Name: White Reed Feather
      Lore:
      - A rare Reedflower Rod catch.
      - Required to craft the Snowy River Rod.
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_HANJIANG_XUEPOZHU:
      Name: Snow-Soul Pearl
      Lore:
      - A rare Snowy River catch.
      - Required to craft the Fine Rain · Slanting Wind rod.

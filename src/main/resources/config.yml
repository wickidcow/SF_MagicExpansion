options:
  # The original Guizhan updater has been removed from this English fork.
  auto-update: false
  ignore-outdated-warning: false
  test: false
  clear-old-config: false

# External fishing engines are authoritative by default. MagicExpansion keeps
# Water Cloud proficiency, Magic lure preservation, and safe bonus rewards but
# does not replace another plugin's hook/catch flow.
fishing-integration:
  external-plugins-primary: true
  # AUTO, PyroFishingPro, BetterFishing, or VANILLA
  provider: AUTO
  priority:
    - PyroFishingPro
    - BetterFishing
    - VANILLA

# Upstream's new Water Cloud minigame is available as an optional fallback.
# Legacy keeps it disabled by default so existing fishing plugins remain intact.
fishing-system:
  new-system: false
  only-when-no-external-provider: true

StarShardsSword:
  help: 'Star Shards Sword combat configuration.'
  StarShards_Atk_Mix: 3.8
  # Base attack multiplier. Default: 3.8 (+280%).
  StarShards_Atk_Add: 1314.0
  # Flat attack bonus. Default: 1314.0.
  StarShards_Atk_Mult: 6.18
  # Attack multiplier. Default: 6.18 (+618%).
  StarShards_AtkSpeed: 20.0
  # Attack speed. Default: 20.0.
  StarShards_Atk_ExtraPercent: 0.08
  # Additional percentage damage. Default: 0.08 (+8%).
  StarShards_Atk_Blood: 0.05
  # Stackable bleeding damage. Default: 0.05 (+5%).
  StarShards_Health_Add: 1314.0
  # Flat health bonus. Default: 1314.0.
  StarShards_Health_Mult: 6.18
  # Health multiplier. Default: 6.18 (+618%).
  StarShards_MoveSpeed: 0.618
  # Movement speed modifier. Default: 0.618.
  StarShards_Armor: 200.0
  # Armor bonus. Default: 200.0.
  StarShards_Toughness: 200.0
  # Armor toughness bonus. Default: 200.0.
  StarShards_FlySpeed: 13.14
  # Flight speed modifier. Default: 13.14.
  StarShards_BlazingSlash_CD: 1
  # Left-click skill cooldown in seconds.
  StarShards_ArcaneBlast_CD: 3
  # Shift-left-click skill cooldown in seconds.
  StarShards_AstralShield_CD: 5
  # Right-click skill cooldown in seconds.
  StarShards_AstralShield_During: 5
  # Right-click skill duration in seconds.
  StarShards_InstantBlink_CD: 3
  # Shift-right-click skill cooldown in seconds.

Fish:
  FishingRod:
    FISHING_ROD_FINAL_STICK:
      Enable:
        FinalLure: true
        # Enables the Final Lure (Memory Fragment) effect.
        FinalLure_Obtain: true
        # Allows the Final Lure to be caught while fishing.
    admin-give:
      max-weight: 10000.0

qwen-help:
  help: 'Optional Qwen/DashScope AI chat integration. It is disabled by default.'
  enabled: 'Set true only after supplying a valid API key.'
  cooldown: 'Minimum seconds between requests from the same player.'
  api-key: 'Your private DashScope API key. Never publish or commit a real key.'
  endpoint: 'DashScope-compatible API endpoint.'
  model: 'Qwen model identifier.'
  public-mode: 'Whether public AI chat starts enabled after a restart.'
  ai-error: 'Message displayed when an AI request fails.'

qwen:
  enabled: false
  api-key: 'your_api_key_here'
  endpoint: 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation'
  model: 'qwen-plus'
  public-mode: false
  ai-error: '&cAI request failed. Please try again later.'
  cooldown: 3

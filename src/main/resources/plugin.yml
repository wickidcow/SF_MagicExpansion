name: magicexpansion
main: io.Yomicer.magicExpansion.MagicExpansion
version: ${project.version}
author: Yomicer
api-version: '26.2'
depend: [Slimefun]
softdepend: [RykenSlimeCustomizer, Networks, NetworksExpansion]
description: English-first MagicExpansion build for Slimefun Legacy with United and Gugu compatibility.

commands:
  magicexpansion:
    description: Main MagicExpansion administration command.
    usage: /magicexpansion <reload|slimefun>
    permission: magicexpansion.command
    permission-message: '&cYou do not have permission to use this command.'
  mxw:
    description: Manage MagicExpansion map worlds.
  mxf:
    description: Open or receive the Fishing Guide.
    usage: /<command> <open_guide|guide>
  mxai:
    description: Control optional AI chat features.
    usage: /mxai <chaton|chatoff|public|publicmode>
    permission: mxai.use
    permission-message: '&cYou do not have permission to use AI commands.'
  magicfish:
    description: Give a configured MagicExpansion fish.
    usage: /magicfish give <fish> [weight] [amount]
    permission: magicexpansion.admin.fish
    permission-message: '&cYou do not have permission to use this command.'
  mxwand:
    description: Obtain the Magic Altar wand.
    usage: /<command> wand
    permission: mxwand.wand
  mxalter:
    description: Open or receive the Magic Altar recipe guide.
    usage: /<command> <guide|open_guide>
    aliases: [malt]
  magicshop:
    description: Open the portable MagicExpansion shop.
    usage: /magicshop <open|admin>
    aliases: [mshop]

permissions:
  magicexpansion.command:
    description: Allows use of the MagicExpansion administration command.
    default: op
  MagicExpansionMachines.use:
    description: Allows players to use MagicExpansion machines.
    default: op
  mxai.use:
    description: Allows use of personal AI chat features.
    default: true
  mxai.op:
    description: Allows control of server-wide AI chat modes.
    default: op
  mxwand.wand:
    description: Allows obtaining the Magic Altar wand.
    default: op
  magicexpansion.admin.fish:
    description: Allows use of the Magic Fish administration command.
    default: op
  magicexpansion.shop.admin:
    description: Allows access to the shop administration menu.
    default: op

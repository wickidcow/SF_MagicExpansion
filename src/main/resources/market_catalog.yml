# Albion Magic Market catalog - append-only installation, not live shop storage.
# Requires the market-catalog feature build; old MagicExpansion 1.1.14 does NOT read this file.
# Left-click the admin sunflower or run /magicshop generate to install missing offers.
# Repeating that action never resets usage, edits installed prices, or duplicates an offer ID.
# Keep IDs permanent. A NEW ID grants a NEW independent allowance. Never rename IDs to edit prices.
# All prices below use PHYSICAL inventory items, not Vault/server money. Starting prices need balancing.
# personalLimit counts transactions: result amount 16 with limit 16 permits 256 items per player.
# globalLimit is deliberately always 0 (no shared server cap); there is no automatic stock reset.
# Missing/disabled rewards OR payment items skip the complete offer. Optional addons are not dependencies.
# Existing portable_shops files and black_market receipt/cycle files are not replaced by this catalog.
# Each armor piece is a separate once-per-player offer; buying armor does not unlock its research.
# The example is a real, low-cost, once-per-player trade, independent from Xur's stock.
version: 1
